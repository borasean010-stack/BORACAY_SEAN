<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 센터 - Boracay Sean</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="admin.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="smartstore-admin">
    <!-- Admin Login -->
    <div id="login-container" class="admin-login-wrapper">
        <div class="admin-login-card">
            <div class="admin-login-header">
                <div class="admin-logo-box"><img src="logo.png" alt="Logo"></div>
                <h1>BORACAY SEAN</h1>
                <h2>파트너 센터</h2>
                <p>관리 시스템에 로그인하세요.</p>
            </div>
            <form id="login-form">
                <div class="admin-form-group">
                    <label>아이디</label>
                    <input type="text" id="username" placeholder="아이디" required>
                </div>
                <div class="admin-form-group">
                    <label>비밀번호</label>
                    <input type="password" id="password" placeholder="비밀번호" required>
                </div>
                <button type="submit" class="btn-admin-login">로그인</button>
            </form>
        </div>
    </div>

    <div id="admin-container" class="admin-full-layout" style="display: none;">
        <!-- 1. Sidebar -->
        <aside class="ss-sidebar">
            <div class="ss-sidebar-brand">
                <img src="logo.png" alt="Logo" class="ss-logo">
                <span class="ss-brand-name">관리자 센터</span>
            </div>
            <nav class="ss-nav">
                <div class="ss-nav-group">
                    <p class="ss-nav-label">일정 관리</p>
                    <button class="ss-nav-item active" id="menu-today" onclick="switchAdminTab('today')">
                        <span class="material-icons">today</span> 오늘 일정
                    </button>
                    <button class="ss-nav-item" id="menu-tomorrow" onclick="switchAdminTab('tomorrow')">
                        <span class="material-icons">event_next</span> 내일 일정
                    </button>
                </div>
                <div class="ss-nav-group">
                    <p class="ss-nav-label">바우처 & 스케줄</p>
                    <button class="ss-nav-item" id="menu-quick" onclick="switchAdminTab('quick')">
                        <span class="material-icons">confirmation_number</span> 퀵바우처 생성기
                    </button>
                    <button class="ss-nav-item" id="menu-reg" onclick="switchAdminTab('reg')">
                        <span class="material-icons">upload_file</span> 스케줄 등록
                    </button>
                </div>
                <div class="ss-nav-group">
                    <p class="ss-nav-label">시스템</p>
                    <button class="ss-nav-item" id="menu-new" onclick="switchAdminTab('new')">
                        <span class="material-icons">inbox</span> 예약 접수
                    </button>
                    <button class="ss-nav-item system-danger" id="menu-system" onclick="switchAdminTab('system')">
                        <span class="material-icons">settings</span> 초기화
                    </button>
                </div>
            </nav>
            <div class="ss-sidebar-footer">
                <button id="logout-btn"><span class="material-icons">logout</span> 로그아웃</button>
            </div>
        </aside>

        <!-- 2. Main Content -->
        <div class="ss-main">
            <header class="ss-top-header">
                <div class="ss-header-left">
                    <span class="material-icons">menu</span>
                    <span class="ss-breadcrumb">관리자 > <b id="breadcrumb-active">오늘 일정</b></span>
                </div>
                <div class="ss-header-right"><span id="display-admin-id">Admin</span>님 반갑습니다.</div>
            </header>

            <div class="ss-content">
                
                <!-- 📅 1. Schedule View (Today/Tomorrow) -->
                <div id="view-schedule" class="admin-view">
                    <div class="ss-view-header">
                        <h2 id="schedule-title">일정 확인</h2>
                        <div class="schedule-tabs" id="schedule-tabs">
                            <button class="s-tab active" onclick="filterSchedule('all')">전체</button>
                            <button class="s-tab" onclick="filterSchedule('픽업')">픽업</button>
                            <button class="s-tab" onclick="filterSchedule('샌딩')">샌딩</button>
                            <button class="s-tab" onclick="filterSchedule('호핑')">호핑</button>
                            <button class="s-tab" onclick="filterSchedule('말룸파티')">말룸파티</button>
                            <button class="s-tab" onclick="filterSchedule('액티비티')">액티비티</button>
                        </div>
                    </div>
                    <div id="active-timeline" class="schedule-timeline" style="display: flex; flex-wrap: wrap; gap: 15px;">
                        <div class="sc-empty">데이터를 불러오는 중...</div>
                    </div>
                </div>

                <!-- 🎫 2. Quick Voucher View -->
                <div id="view-quick" class="admin-view" style="display: none;">
                    <div class="ss-card" style="padding: 30px; border-left: 5px solid #ff6a00;">
                        <div style="margin-bottom: 20px;">
                            <h3 style="margin: 0; font-size: 20px; font-weight: 800; color: #ff6a00;">퀵바우처 즉시 생성기</h3>
                            <p style="color: #666; margin-top: 5px;">수입시트 데이터를 붙여넣으세요.</p>
                        </div>
                        <textarea id="quick-voucher-input" placeholder="여기에 데이터를 붙여넣으세요..." style="width: 100%; height: 150px; padding: 15px; border: 1px solid #ddd; border-radius: 8px; font-family: monospace; font-size: 13px; margin-bottom: 15px;"></textarea>
                        <button class="btn-action-received" style="width: 100%; height: 50px; font-size: 16px;" onclick="makeQuickVoucher()">
                            <span class="material-icons">add_link</span> 바우처 생성 및 링크 복사
                        </button>
                    </div>
                </div>

                <!-- 📤 3. Schedule Registration View -->
                <div id="view-reg" class="admin-view" style="display: none;">
                    <div class="ss-card" style="padding: 30px; border-left: 5px solid #00c73c;">
                        <div style="margin-bottom: 20px;">
                            <h3 style="margin: 0; font-size: 20px; font-weight: 800; color: #00c73c;">스케줄 일괄 등록</h3>
                            <p style="color: #666; margin-top: 5px;">전체 수입시트 데이터를 붙여넣으세요 (Q열까지만 자동 분석됩니다).</p>
                        </div>
                        <textarea id="schedule-reg-input" placeholder="매일 아침 데이터를 업데이트하세요..." style="width: 100%; height: 150px; padding: 15px; border: 1px solid #ddd; border-radius: 8px; font-family: monospace; font-size: 13px; margin-bottom: 15px;"></textarea>
                        <button class="btn-action-received" style="width: 100%; height: 50px; font-size: 16px; background: #00c73c; box-shadow: 0 4px 10px rgba(0, 199, 60, 0.2);" onclick="registerBulkSchedule()">
                            <span class="material-icons">cloud_upload</span> 스케줄 업데이트 하기
                        </button>
                    </div>
                </div>

                <!-- 📥 4. New Reservation View (System) -->
                <div id="view-new" class="admin-view" style="display: none;">
                    <div class="ss-view-header">
                        <h2>홈페이지 예약 접수 건</h2>
                        <input type="text" id="header-global-search" placeholder="고객명 검색" class="ss-search">
                    </div>
                    <div class="ss-card">
                        <div class="ss-table-wrapper">
                            <table class="ss-table">
                                <thead>
                                    <tr>
                                        <th width="50">번호</th>
                                        <th width="120">고객명</th>
                                        <th>상품 정보</th>
                                        <th width="120">금액</th>
                                        <th width="100">상태</th>
                                        <th width="100">액션</th>
                                    </tr>
                                </thead>
                                <tbody id="admin-table-body"></tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- 💎 System Reset View -->
                <div id="view-system" class="admin-view" style="display: none;">
                    <div class="system-view">
                        <span class="material-icons sv-icon">security</span>
                        <h2 class="sv-title">데이터 초기화</h2>
                        <button class="btn-danger-luxury" onclick="handleClearAllData()">데이터 영구 삭제</button>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Detail Modal -->
    <div id="res-detail-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header"><h3>상세 정보</h3><button onclick="closeModal()">✕</button></div>
            <div class="modal-body" id="modal-body"></div>
            <div class="modal-footer"><button class="btn-action-outline" onclick="closeModal()">닫기</button></div>
        </div>
    </div>

    <script type="module" src="admin.js"></script>
</body>
</html>
