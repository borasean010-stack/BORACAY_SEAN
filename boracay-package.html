<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>보라카이션 패키지 - 보라카이 핵심 투어 조합</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <style>
        .tour-detail-container { max-width: 1100px; margin: 120px auto 50px; display: grid; grid-template-columns: 1fr 360px; gap: 40px; padding: 0 20px; }
        .tour-content { background: white; padding: 40px; border-radius: 28px; box-shadow: 0 15px 40px rgba(0,0,0,0.03); }
        .reservation-box { background: white; border-radius: 20px; padding: 15px; box-shadow: 0 20px 50px rgba(0,0,0,0.08); position: sticky; top: 80px; height: fit-content; border: 1px solid #f0f0f0; }
        .package-option { border: 2px solid #eee; padding: 15px; border-radius: 12px; margin-bottom: 10px; cursor: pointer; }
        .package-option.selected { border-color: #ff6a00; background: #fffaf5; }
    </style>
</head>
<body>
<div class="tour-detail-container">
    <div class="tour-content">
        <h1>보라카이션 패키지</h1>
        <img src="package1.png" style="width:100%; border-radius:20px; margin-bottom:20px;">
        <div class="section-title">패키지 옵션 선택</div>
        <div id="package-options">
            <div class="package-option" onclick="selectPkg('시그니처', 320000)"><h4>시그니처 패키지</h4><p>픽샌 + 호핑 + 말룸 + 고래상어</p></div>
            <div class="package-option" onclick="selectPkg('패키지 A', 270000)"><h4>패키지 A</h4><p>픽샌 + 말룸 + 고래상어</p></div>
        </div>
    </div>
    <div class="reservation-box">
        <div id="total-price" style="font-size:24px; font-weight:900; color:#ff6a00; margin-bottom:20px;">₩ 320,000</div>
        <button class="btn-buy" onclick="handleBuy()">구매하기</button>
    </div>
</div>
<script>
    let selectedPkg = { name: '시그니처', price: 320000 };
    function selectPkg(name, price) {
        selectedPkg = { name, price };
        document.querySelectorAll('.package-option').forEach(el => el.classList.remove('selected'));
        event.currentTarget.classList.add('selected');
        document.getElementById('total-price').innerText = '₩ ' + price.toLocaleString();
    }
    function handleBuy() {
        sessionStorage.setItem('directBuyItem', JSON.stringify({ name: '보라카이션 패키지 - ' + selectedPkg.name, price: selectedPkg.price, count: 1, isPackage: true }));
        window.open('booking-form.html', '_blank');
    }
</script>
</body>
</html>
