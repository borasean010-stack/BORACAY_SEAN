<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>고래상어 리버타드 카운터</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <style>
        body { margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; background: #f4f7f6; color: #111; }
        .container { max-width: 500px; margin: 0 auto; min-height: 100vh; background: #fff; display: flex; flex-direction: column; }
        .header { background: #007aff; padding: 20px; text-align: center; color: #fff; position: relative; }
        .header h1 { margin: 0; font-size: 22px; font-weight: 900; }
        .header p { margin: 5px 0 0 0; font-size: 13px; opacity: 0.8; }
        .header .dashboard-link { position: absolute; top: 16px; right: 16px; display: flex; align-items: center; gap: 4px; padding: 8px 14px; background: rgba(255,255,255,0.15); border-radius: 20px; color: #fff; text-decoration: none; font-size: 13px; font-weight: 700; }
        .header .dashboard-link:active { background: rgba(255,255,255,0.3); }
        
        .content { padding: 30px 20px; flex: 1; display: flex; flex-direction: column; align-items: center; }
        
        .card { width: 100%; background: #fff; border-radius: 16px; padding: 24px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); box-sizing: border-box; text-align: center; margin-bottom: 20px; border: 1px solid #eee; }
        
        .stat-label { color: #888; font-size: 14px; font-weight: 600; margin-bottom: 10px; }
        .stat-value { font-size: 48px; font-weight: 900; color: #007aff; line-height: 1; }
        
        .input-group { margin: 20px 0; width: 100%; text-align: left; }
        .input-group label { display: block; font-weight: bold; margin-bottom: 8px; color: #555; }
        .input-group input { width: 100%; padding: 15px; font-size: 20px; text-align: center; border: 2px solid #ddd; border-radius: 12px; box-sizing: border-box; font-weight: bold; transition: 0.2s; }
        .input-group input:focus { border-color: #007aff; outline: none; }
        
        .btn-primary { width: 100%; padding: 16px; font-size: 18px; font-weight: bold; background: #007aff; color: #fff; border: none; border-radius: 12px; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 10px rgba(0,122,255,0.3); }
        .btn-primary:active { transform: scale(0.98); background: #0062cc; }
        .btn-primary:disabled { background: #ccc; box-shadow: none; cursor: not-allowed; }
        
        .btn-secondary { padding: 12px 20px; font-size: 14px; font-weight: bold; background: #fff; color: #333; border: 1px solid #ddd; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 8px; margin: 0 auto; }
        
        #reader { width: 100%; max-width: 400px; margin: 0 auto; display: none; }
        
        .overlay-loader { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,0.9); z-index: 999; display: flex; flex-direction: column; justify-content: center; align-items: center; display: none; }
        .spinner { border: 4px solid rgba(0,0,0,0.1); width: 40px; height: 40px; border-radius: 50%; border-left-color: #007aff; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="overlay-loader" id="loader">
    <div class="spinner"></div>
    <div style="font-weight:bold; color:#555;">처리 중입니다...</div>
</div>

<div class="container">
    <div class="header">
        <a class="dashboard-link" href="whale-dashboard.html">
            <span class="material-icons" style="font-size:16px;">dashboard</span> 대시보드
        </a>
        <img src="libertad.png" alt="Libertad Whale Shark" style="width:56px; height:56px; object-fit:contain; margin-bottom:8px;">
        <h1>고래상어 현장 카운터</h1>
        <p>리버타드 전용</p>
    </div>
    
    <!-- 스캔 화면 -->
    <div class="content" id="view-scan" style="display: none; justify-content: center;">
        <div style="text-align:center; width:100%;">
            <span class="material-icons" style="font-size:64px; color:#ddd; margin-bottom:20px;">qr_code_scanner</span>
            <h2 style="margin-top:0; color:#333;">QR 코드를 스캔하세요</h2>
            <p style="color:#888; font-size:14px; margin-bottom:30px;">방문객이 제시한 QR코드를 스캔하여<br>잔여 티켓을 확인합니다.</p>
            <div id="reader"></div>
            <button class="btn-primary" onclick="startScanner()" id="btn-start-scan" style="margin-bottom:15px;">카메라로 스캔하기</button>
        </div>
    </div>
    
    <!-- 카운터 (차감) 화면 -->
    <div class="content" id="view-counter" style="display: none;">
        <div class="card">
            <div class="stat-label">사용 가능 티켓</div>
            <div class="stat-value" id="display-remain">0</div>
        </div>
        
        <div class="card" style="border: 2px solid #007aff;">
            <div class="input-group" style="margin: 0;">
                <label style="text-align:center; color:#007aff; font-size:16px;">방문 인원 입력</label>
                <input type="number" id="input-count" placeholder="0" min="1" pattern="[0-9]*" inputmode="numeric">
            </div>
        </div>
        
        <button class="btn-primary" id="btn-deduct">티켓 차감 승인</button>
        
        <div style="margin-top:30px;">
            <button class="btn-secondary" onclick="resetToScan()"><span class="material-icons">refresh</span> 다시 스캔하기</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs, doc, runTransaction } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDkDjmGKQDF-0Vu2S_qtI6W5Hf2-j4tKcM",
        authDomain: "boracaysean-69b4a.firebaseapp.com",
        projectId: "boracaysean-69b4a",
        storageBucket: "boracaysean-69b4a.firebasestorage.app",
        messagingSenderId: "806585874771",
        appId: "1:806585874771:web:64a094d241730ca38109a6"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let html5QrcodeScanner = null;
    let currentAgencyId = null;

    window.showLoader = function(show) {
        document.getElementById('loader').style.display = show ? 'flex' : 'none';
    }

    // 1. URL에서 Token 파싱 및 화면 전환
    async function init() {
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        
        if (token) {
            await loadAgencyByToken(token);
        } else {
            document.getElementById('view-scan').style.display = 'flex';
        }
    }

    // 2. 토큰으로 판매처 검증
    async function loadAgencyByToken(token) {
        showLoader(true);
        try {
            const q = query(collection(db, "whale_agencies"), where("token", "==", token));
            const querySnapshot = await getDocs(q);
            
            if (querySnapshot.empty) {
                Swal.fire('오류', '유효하지 않은 QR 코드입니다.', 'error').then(() => {
                    resetToScan();
                });
                return;
            }
            
            const agencyDoc = querySnapshot.docs[0];
            const agency = agencyDoc.data();
            
            if (agency.status !== 'ACTIVE') {
                Swal.fire('정지됨', '해당 판매처는 현재 정지 상태입니다. 관리자에게 문의하세요.', 'warning').then(() => {
                    resetToScan();
                });
                return;
            }
            
            currentAgencyId = agencyDoc.id;
            
            document.getElementById('view-scan').style.display = 'none';
            document.getElementById('view-counter').style.display = 'flex';
            document.getElementById('display-remain').innerText = agency.remainCount || 0;
            document.getElementById('input-count').value = '';
            
        } catch (e) {
            console.error(e);
            Swal.fire('오류', '데이터를 불러오는 중 오류가 발생했습니다.', 'error');
        } finally {
            showLoader(false);
        }
    }

    // 3. 트랜잭션을 통한 원자적 차감
    document.getElementById('btn-deduct').addEventListener('click', async () => {
        if (!currentAgencyId) return;
        
        const deductCountStr = document.getElementById('input-count').value;
        const deductCount = parseInt(deductCountStr);
        
        if (isNaN(deductCount) || deductCount <= 0) {
            Swal.fire('오류', '차감할 올바른 인원수를 입력해주세요.', 'warning');
            return;
        }

        const confirmMsg = `총 ${deductCount}장의 티켓을 사용 처리하시겠습니까?`;
        if (!confirm(confirmMsg)) return;

        showLoader(true);
        const agencyRef = doc(db, "whale_agencies", currentAgencyId);
        
        const today = new Date();
        const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
        const dailyCountRef = doc(db, "whale_daily_counts", todayStr);
        
        const newTransactionRef = doc(collection(db, "whale_transactions")); // 자동 ID 생성

        try {
            await runTransaction(db, async (transaction) => {
                const agencyDoc = await transaction.get(agencyRef);
                if (!agencyDoc.exists()) {
                    throw "판매처 데이터를 찾을 수 없습니다.";
                }
                
                const agencyData = agencyDoc.data();
                const currentRemain = agencyData.remainCount || 0;
                
                if (currentRemain < deductCount) {
                    throw `잔여 티켓이 부족합니다. (현재: ${currentRemain}장)`;
                }

                // [중요] Firestore 트랜잭션 규칙: 모든 GET(읽기)는 UPDATE/SET(쓰기) 전에 수행되어야 함!
                const dailyDoc = await transaction.get(dailyCountRef);

                // 판매처 잔여량/사용량 갱신
                const newRemain = currentRemain - deductCount;
                const newTotalUsed = (agencyData.totalUsed || 0) + deductCount;
                
                let newMonthlyUsed = agencyData.monthlyUsed || 0;
                const todayForTx = new Date();
                const currentMonthStr = `${todayForTx.getFullYear()}-${String(todayForTx.getMonth() + 1).padStart(2, '0')}`;
                
                if (agencyData.currentMonth === currentMonthStr) {
                    newMonthlyUsed += deductCount;
                } else {
                    newMonthlyUsed = deductCount;
                }

                transaction.update(agencyRef, {
                    remainCount: newRemain,
                    totalUsed: newTotalUsed,
                    monthlyUsed: newMonthlyUsed,
                    currentMonth: currentMonthStr,
                    updatedAt: new Date().toISOString()
                });

                // 일일 방문자 카운트 갱신
                let newDailyCount = deductCount;
                if (dailyDoc.exists()) {
                    newDailyCount += (dailyDoc.data().count || 0);
                    transaction.update(dailyCountRef, { count: newDailyCount });
                } else {
                    transaction.set(dailyCountRef, { count: newDailyCount, date: todayStr });
                }

                // 트랜잭션 로그 기록
                transaction.set(newTransactionRef, {
                    agencyId: currentAgencyId,
                    type: 'USE',
                    amount: deductCount,
                    createdAt: new Date().toISOString()
                });
            });

            const result = await Swal.fire({
                icon: 'success',
                title: '처리 완료',
                text: `${deductCount}명 차감했습니다.`,
                confirmButtonText: '완료',
                showCancelButton: true,
                cancelButtonText: '잘못 입력했어요 (취소)',
                cancelButtonColor: '#ff3b30',
                reverseButtons: true
            });

            if (result.dismiss === Swal.DismissReason.cancel) {
                await undoTransaction(currentAgencyId, newTransactionRef.id, deductCount);
            } else {
                resetToScan();
            }

        } catch (e) {
            console.error(e);
            Swal.fire('오류', e.toString(), 'error');
        } finally {
            showLoader(false);
        }
    });

    // 방금 처리한 차감을 되돌림 (반대 부호 트랜잭션으로 상쇄 — 기존 정산/통계 집계 로직을 그대로 재사용)
    async function undoTransaction(agencyId, originalTransactionId, amount) {
        showLoader(true);
        const agencyRef = doc(db, "whale_agencies", agencyId);
        const today = new Date();
        const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
        const dailyCountRef = doc(db, "whale_daily_counts", todayStr);
        const cancelRef = doc(collection(db, "whale_transactions"));

        try {
            await runTransaction(db, async (transaction) => {
                const agencyDoc = await transaction.get(agencyRef);
                if (!agencyDoc.exists()) throw "판매처 데이터를 찾을 수 없습니다.";
                const agencyData = agencyDoc.data();

                const dailyDoc = await transaction.get(dailyCountRef);

                transaction.update(agencyRef, {
                    remainCount: (agencyData.remainCount || 0) + amount,
                    totalUsed: Math.max(0, (agencyData.totalUsed || 0) - amount),
                    monthlyUsed: Math.max(0, (agencyData.monthlyUsed || 0) - amount),
                    updatedAt: new Date().toISOString()
                });

                if (dailyDoc.exists()) {
                    transaction.update(dailyCountRef, { count: Math.max(0, (dailyDoc.data().count || 0) - amount) });
                }

                transaction.set(cancelRef, {
                    agencyId,
                    type: 'USE',
                    amount: -amount,
                    createdAt: new Date().toISOString(),
                    isCancellation: true,
                    cancelsTransactionId: originalTransactionId
                });
            });

            Swal.fire('취소 완료', '차감을 되돌렸습니다.', 'success').then(() => resetToScan());
        } catch (e) {
            console.error(e);
            Swal.fire('오류', '취소 처리 중 문제가 발생했습니다: ' + e.toString(), 'error');
        } finally {
            showLoader(false);
        }
    }

    // 4. QR 스캐너 초기화 및 시작 (html5-qrcode)
    window.startScanner = function() {
        document.getElementById('btn-start-scan').style.display = 'none';
        document.getElementById('reader').style.display = 'block';
        
        html5QrcodeScanner = new Html5Qrcode("reader");
        const config = {
            fps: 15,
            // 스캔 박스를 화면(뷰파인더) 크기에 비례하게 잡아서, 고정 250px 박스에 QR을
            // 딱 맞춰야만 인식되던 문제를 해결 (뷰파인더의 75%, 최대 280px)
            qrbox: (viewfinderWidth, viewfinderHeight) => {
                const minEdge = Math.min(viewfinderWidth, viewfinderHeight);
                const size = Math.min(Math.floor(minEdge * 0.75), 280);
                return { width: size, height: size };
            },
            aspectRatio: 1.0,
            videoConstraints: {
                facingMode: "environment",
                width: { ideal: 1920 },
                height: { ideal: 1080 }
            }
        };

        html5QrcodeScanner.start({ facingMode: "environment" }, config,
            (decodedText, decodedResult) => {
                // 성공 시 스캐너 중지
                html5QrcodeScanner.stop().then(() => {
                    document.getElementById('reader').style.display = 'none';
                    document.getElementById('btn-start-scan').style.display = 'block';
                    
                    // URL 파싱해서 토큰 추출
                    try {
                        const parsedUrl = new URL(decodedText);
                        const token = parsedUrl.searchParams.get('token');
                        if (token) {
                            loadAgencyByToken(token);
                        } else {
                            Swal.fire('오류', '유효하지 않은 QR 코드입니다.', 'error');
                        }
                    } catch(e) {
                        // URL 형식이 아닌 경우 (직접 토큰만 담긴 경우 대비)
                        if (decodedText.startsWith('ws_')) {
                            loadAgencyByToken(decodedText);
                        } else {
                            Swal.fire('오류', '잘못된 형식의 QR 코드입니다.', 'error');
                        }
                    }
                }).catch(err => {
                    console.error("스캐너 중지 실패", err);
                });
            },
            (errorMessage) => {
                // 스캔 중 (무시)
            })
        .catch(err => {
            console.error(err);
            Swal.fire('카메라 오류', '카메라 권한을 허용해주세요.', 'error');
            document.getElementById('btn-start-scan').style.display = 'block';
            document.getElementById('reader').style.display = 'none';
        });
    };

    window.resetToScan = function() {
        currentAgencyId = null;
        if (html5QrcodeScanner && html5QrcodeScanner.isScanning) {
            html5QrcodeScanner.stop().catch(console.error);
        }
        
        // URL의 토큰 제거
        const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
        window.history.pushState({path:newUrl}, '', newUrl);

        document.getElementById('view-counter').style.display = 'none';
        document.getElementById('view-scan').style.display = 'flex';
        document.getElementById('reader').style.display = 'none';
        document.getElementById('btn-start-scan').style.display = 'block';
    };

    // 초기화 실행
    document.addEventListener('DOMContentLoaded', init);
</script>

</body>
</html>
