<script src="main.js"></script>
<script>
    function checkoutCart() {
        try {
            sessionStorage.removeItem('directBuyItem');
            window.location.assign('booking-form.html');
        } catch (e) {
            window.location.href = 'booking-form.html';
        }
    }
</script>
<script>
    function loadCart() {
        const cart = JSON.parse(localStorage.getItem('cart') || '[]');
        const listContainer = document.getElementById('cart-list');
        const checkoutBar = document.getElementById('checkout-bar');
        if (cart.length === 0) { listContainer.innerHTML = '<div style="text-align:center; padding:100px 0; color:#ccc; font-size:18px; font-weight:600;">장바구니가 비어 있습니다.</div>'; checkoutBar.style.display = 'none'; return; }
        checkoutBar.style.display = 'flex';
        listContainer.innerHTML = '';
        let total = 0;
        cart.forEach((item, index) => {
            // 통일된 금액 계산 로직: item.totalPrice 우선
            const itemTotal = item.totalPrice || (item.price * item.count);
            total += itemTotal;
            
            let itemDate = item.date || '';
            if (item.name.includes('픽업샌딩')) {
                itemDate = `${item.pickupDate} ~ ${item.sendingDate}`;
            }

            let detailsText = item.details || '';
            if (detailsText && (item.name.includes('마사지') || item.name.includes('스파'))) {
                detailsText = `종류: ${detailsText}`;
            }

            listContainer.innerHTML += `
                <div class="cart-item">
                    <div class="item-info">
                        <h4>${item.name}</h4>
                        <p style="font-size:14px; color:#666;">예약일: ${itemDate} ${item.time || ''}</p>
                        <p style="font-size:14px; color:#666;">인원: ${item.count}명 ${detailsText ? `| ${detailsText}` : ''}</p>
                        <button class="remove-btn" onclick="removeItem(${index})">삭제하기</button>
                    </div>
                    <div class="item-price">₩ ${itemTotal.toLocaleString()}</div>
                </div>`;
        });
        document.getElementById('final-price').innerText = '₩ ' + total.toLocaleString();
    }
    function removeItem(index) { let cart = JSON.parse(localStorage.getItem('cart') || '[]'); cart.splice(index, 1); localStorage.setItem('cart', JSON.stringify(cart)); loadCart(); }
    window.addEventListener('DOMContentLoaded', loadCart);
</script>
