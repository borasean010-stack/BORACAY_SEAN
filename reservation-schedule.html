<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>예약 확인서 - Boracay Sean</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; background: #f0f2f5; margin: 0; padding: 40px 20px; color: #333; line-height: 1.6; }
        .voucher-container { max-width: 800px; margin: 0 auto; background: #fff; border-radius: 30px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.1); }
        .voucher-header { background: #ff6a00; color: #fff; padding: 40px; text-align: center; }
        .voucher-header img { width: 80px; margin-bottom: 15px; }
        .voucher-header h1 { margin: 0; font-size: 28px; font-weight: 900; letter-spacing: 2px; }
        .voucher-header p { margin: 10px 0 0 0; opacity: 0.6; font-size: 14px; }
        
        .voucher-body { padding: 40px; }
        .section-title { font-size: 18px; font-weight: 800; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; color: #ff6a00; }
        .section-title::before { content: ''; width: 4px; height: 18px; background: #ff6a00; border-radius: 2px; }
        
        .info-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; background: #f9fafb; padding: 25px; border-radius: 20px; margin-bottom: 40px; }
        .info-item label { display: block; font-size: 12px; color: #888; margin-bottom: 5px; font-weight: 600; }
        .info-item span { display: block; font-size: 16px; font-weight: 700; color: #111; }
        
        .item-card { border: 1px solid #eee; border-radius: 20px; padding: 25px; margin-bottom: 20px; transition: 0.3s; }
        .item-card:hover { border-color: #ff6a00; box-shadow: 0 10px 30px rgba(255,106,0,0.05); }
        .item-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; }
        .item-name { font-size: 18px; font-weight: 800; color: #111; }
        .item-status { background: #fff5eb; color: #ff6a00; font-size: 12px; font-weight: 800; padding: 6px 12px; border-radius: 50px; }
        
        .item-details { display: flex; flex-wrap: wrap; gap: 20px; margin-bottom: 15px; }
        .detail-point { font-size: 14px; color: #666; display: flex; align-items: center; gap: 8px; }
        .detail-point .material-icons { font-size: 18px; color: #ff6a00; }
        .detail-point b { color: #111; margin-right: 4px; }

        .guidance-box { font-size: 14px; color: #555; line-height: 1.7; white-space: pre-wrap; margin-top: 15px; padding-top: 15px; border-top: 1px dashed #eee; }
        .map-btn { display: inline-block; margin: 8px 0; padding: 8px 15px; background: #fff; border: 1px solid #ff6a00; color: #ff6a00; border-radius: 8px; font-size: 12px; font-weight: 700; text-decoration: none; }
        .map-btn:hover { background: #ff6a00; color: #fff; }

        .notice-box { background: #fff8e6; border-radius: 20px; padding: 25px; border: 1px solid #ffeeba; margin-top: 40px; }
        .notice-box h4 { margin: 0 0 10px 0; font-size: 15px; font-weight: 800; color: #856404; }
        .notice-box ul { margin: 0; padding-left: 20px; font-size: 13px; color: #856404; }
        
        .print-btn { position: fixed; bottom: 30px; right: 30px; background: #ff6a00; color: #fff; border: none; padding: 15px 30px; border-radius: 50px; font-weight: 800; cursor: pointer; box-shadow: 0 10px 30px rgba(255,106,0,0.3); transition: 0.3s; z-index: 1000; }
        
        @media print {
            body { padding: 0; background: #fff; }
            .print-btn { display: none; }
            .voucher-container { box-shadow: none; border-radius: 0; max-width: 100%; margin: 0; }
        }
    </style>
</head>
<body>

<div class="voucher-container">

</div>

    function getKorResort(engName) {
        if (!engName) return '';
        const low = engName.toLowerCase();
        for (const [eng, kor] of Object.entries(resortMap)) {
            if (low.includes(eng)) return kor;
        }
        return engName; // 매핑 안되면 원래 이름 반환
    }

    // 📍 스테이션 1~0 지역 리조트인지 확인 (샌딩 시간 08:10 적용 대상)
    function isStation10(resortName) {
        if (!resortName) return false;
        const low = resortName.toLowerCase();
        const station10Keywords = [
            'crimson', 'movenpick', 'shangri-la', 'shangrila', 'discovery', 'the lind', 'lind',
            'prime', 'aqua', 'two seasons', 'canyon', 'savoy', 'belmont', 'fairways', 'savoy'
        ];
        return station10Keywords.some(kw => low.includes(kw));
    }

    // ✈️ 공항명 (항공편 구분 없이 "공항"으로 통일)
    function getAirportName(flight) {
        return "공항";
    }

    // --- 📅 투어별 상세 안내문 생성기 ---
    function getTourGuidance(name, item, res) {
        const details = (item.details || "").toLowerCase();
        const lowerName = name.toLowerCase();
        const tourMonth = item.date ? parseInt(item.date.split('-')[1]) : new Date().getMonth() + 1;
        const isDrySeason = tourMonth <= 5 || tourMonth >= 11;

        // 1. 공항 픽업
        if (lowerName.includes('공항 픽업') || lowerName.includes('meeting') || lowerName.includes('pickup')) {
            const airport = getAirportName(res.pickupFlight || item.details);
            return `<div class="guidance-box"><b>미팅 장소 : ${airport} 밖 피켓 대기</b>\n\n★공항 밖에서 보라카이션 픽업 직원이 보라카이션 피켓을 들고 대기 하고 있습니다.\n픽업 직원과 대표자 성함 확인 후 안내에 따라 주시기 바랍니다. 항공이 딜레이가 되도 기다립니다.</div>`;
        }
        // 2. 공항 샌딩
        if (lowerName.includes('공항 샌딩') || lowerName.includes('sending')) {
            const rawResort = res.sendingResort || res.pickupResort || '';
            let sendingPlace = getKorResort(rawResort);
            const airport = getAirportName(res.sendingFlight || item.details);
            if (sendingPlace.includes('페어웨이')) sendingPlace = '페어웨이 정문게이트';

            return `<div class="guidance-box"><b>미팅 시간/장소 : ${item.time} ${sendingPlace}</b>\n\n*교통상황에 따라 ${airport} 샌딩 미팅 시간과 장소가 변경될 수있습니다\n\n★지정된 장소와 시간전에 먼저 도착 하셔서 대기 해주셔야 합니다.\n리조트 체크아웃을 완료하고 샌딩 출발 하는 시간 입니다.\n늦어서 별도로 이동을 해야 하는 경우 추가 요금이 발생 합니다.</div>`;
        }
        // 3. 블랙펄/호핑 공통
        if (name.includes('블랙펄') || lowerName.includes('hopping') || lowerName.includes('호핑')) {
            const isLunch = name.includes('점보') || name.includes('점심') || details.includes('점보') || details.includes('식사 포함');
            if (isLunch) {
                return `<div class="guidance-box"><b>투어 미팅 시간 / 장소 : 12:30 / 점보크랩</b>\n<a href="https://goo.gl/maps/d6tdF8tME3p16NtCA" class="map-btn" target="_blank">미팅장소 구글맵 확인</a>\n\n*점보크랩은 메인로드 졸리비 바로 건너편 입니다~\n\n★ 준비물\n편한 물놀이 복장, 비치타올 1인 1장\n스노클 마스크(보유시)\n환경세 1인 100페소 (성인, 소인 동일)\n그외 개인적으로 필요한 물품\n\n블랙펄 기념일 이벤트 안내\n호핑투어 중 생일, 결혼기념일, 프로포즈, 기념일 축하가 있으시면 저희 블랙펄에서 작게 축하 이벤트를 진행해드립니다!\n해당되는 경우 미팅 전까지 카카오톡으로 알려주세요! 사전 요청 필수 / 무료 서비스</div>`;
            } else if (name.includes('보라아재') || name.includes('카라바오')) {
                return `<div class="guidance-box"><b>투어 미팅 시간 / 장소 : 08:00 / 각반 선착장 세븐일레븐 앞</b>\n\n★ 미팅 상세\n- 오전 8시까지 각반(CAGBAN PORT) 선착장 세븐일레븐 앞 보라아재 피켓 든 직원을 찾아주세요.\n- 디몰에서 트라이시클로 약 15분 소요됩니다.\n\n★ 준비물\n래쉬가드, 선크림, 비치타올, 아쿠아슈즈\n매너팁 인당 100페소 (유아 포함)\n그외 개인적으로 필요한 물품 (방수팩, 멀미약 등)\n\n★ 포함 사항\n씨푸드런치, 무제한 음료/맥주/물, 라면간식, 사진촬영, 스노클 장비 대여, 다양한 액티비티(슬라이드, 다이빙 등)\n\n*주의 사항 - 미팅시간 미 준수 시 노쇼 처리되며 환불 불가합니다. 36개월 이하 유아 식사는 별도로 지참해 주세요.</div>`;

        // 고말팩 (고래상어+말룸파티)
        if (name.includes('고말팩')) {

    // 📦 패키지 스케줄 아이템 생성 헬퍼
    function buildPackageSchedule(res, count, allItems) {
        if (res.pickupDate) {
            const pFlight = (res.pickupFlight || '').toUpperCase().trim();
            allItems.push({ name: pFlight ? `\uacf5\ud56d \ud53d\uc5c5 (${pFlight})` : `\uacf5\ud56d \ud53d\uc5c5`, date: res.pickupDate, time: "14:00", count, _res: res });
        }
        if (res.sendingDate) {
            const flight = (res.sendingFlight || '').toUpperCase().trim();
            let sandingTime;
            if (flight === 'TW126') sandingTime = isStation10(res.sendingResort || res.pickupResort) ? "08:10" : "08:30";
            else if (flight.startsWith('TW')) sandingTime = "\uc804\ub0a0 \uc7ac\uc548\ub0b4";
            else if (res.sendingTime) sandingTime = res.sendingTime;
            else if (flight.startsWith('5J') || flight.startsWith('Z2') || flight.startsWith('DG') || (flight.startsWith('PR') && !['PR469','PR489'].includes(flight)) || flight.includes('KLO') || flight.includes('MPH')) sandingTime = "\uc804\ub0a0 \uc7ac\uc548\ub0b4";
            else sandingTime = flight ? "21:00" : "";
            allItems.push({ name: flight ? `\uacf5\ud56d \uc0cc\ub529 (${flight})` : `\uacf5\ud56d \uc0cc\ub529`, date: res.sendingDate, time: sandingTime, count, _res: res });
        }
        if (res.hoppingDate) {
            const isJumbo = res.hoppingJumbo || false;
            allItems.push({ name: isJumbo ? "\ube14\ub799\ud384 \ud638\ud551\ud22c\uc5b4 (+\uc810\ubcf4\ud06c\ub7a9 \uc810\uc2ec)" : "\ube14\ub799\ud384 \uc694\ud2b8\ud638\ud551\ud22c\uc5b4", date: res.hoppingDate, time: isJumbo ? "12:30" : "13:30", count, details: isJumbo ? `\uc810\ubcf4\ud06c\ub7a9 ${res.jumboQty || count}\uba85 \ucd94\uac00 (\ud604\uc9c0 \uc9c0\ubd88 \uc778\ub2f9 $30)` : '', _res: res });
        }
        if (res.malumDate) {
            allItems.push({ name: "\uc2dc\ud06c\ub9bf\uac00\ub4e0 \ub9d0\ub8f8\ud30c\ud2f0", date: res.malumDate, time: "09:40", count, _res: res });
        }
        if (res.oneDayDate) {
            allItems.push({ name: "\ub9ac\ubc84\ud0c0\ub4dc \uace0\ub798\uc0c1\uc5b4", date: res.oneDayDate, time: "07:30", count, _res: res });
            // 원데이 말룸: 날짜/인원만 표시, 미팅 안내문 제거
            allItems.push({ name: "\uc2dc\ud06c\ub9bf\uac00\ub4e0 \ub9d0\ub8f8\ud30c\ud2f0", date: res.oneDayDate, time: "09:40", count, _res: res, noGuidance: true });
        }
        if (res.whaleDate) {
            allItems.push({ name: "\ub9ac\ubc84\ud0c0\ub4dc \uace0\ub798\uc0c1\uc5b4", date: res.whaleDate, time: "07:30", count, _res: res });
        }
    }

    // 📋 단일 예약 items 처리
    function processResItems(res, allItems) {
        const rawItems = res.items || [];
        const defaultCount = rawItems[0]?.count || 1;
        let packageAdded = false;

        rawItems.forEach(item => {
            const itemName = item.name || '';
            if (item.isPackage) {
                if (!packageAdded) { packageAdded = true; buildPackageSchedule(res, item.count, allItems); }
            } else if (itemName.includes('\ud53d\uc5c5\uc0cc\ub529') || itemName.includes('\ud53d\uc5c5') || itemName.includes('\uc0cc\ub529')) {
                if (itemName.includes('\ud53d\uc5c5\uc0cc\ub529') || itemName.includes('\ud53d\uc5c5') || itemName.toLowerCase().includes('meeting')) {
                    const pFlight = (res.pickupFlight || '').toUpperCase().trim();
                    allItems.push({ name: pFlight ? `\uacf5\ud56d \ud53d\uc5c5 (${pFlight})` : `\uacf5\ud56d \ud53d\uc5c5`, date: item.pickupDate || res.pickupDate || item.date, time: item.pickupTime || item.time || "14:00", count: item.count, details: item.details, _res: res });
                }
                if (itemName.includes('\ud53d\uc5c5\uc0cc\ub529') || itemName.includes('\uc0cc\ub529') || itemName.toLowerCase().includes('sending')) {
                    const flight = (res.sendingFlight || item.flight || '').toUpperCase().trim();
                    let sandingTime;
                    if (flight === 'TW126') sandingTime = isStation10(res.sendingResort || res.pickupResort) ? "08:10" : "08:30";
                    else if (flight.startsWith('TW')) sandingTime = "\uc804\ub0a0 \uc7ac\uc548\ub0b4";
                    else if (res.sendingTime || (item.time && item.time !== '21:00')) sandingTime = res.sendingTime || item.time;
                    else if (flight.startsWith('5J') || flight.startsWith('Z2') || flight.startsWith('DG') || (flight.startsWith('PR') && !['PR469','PR489'].includes(flight)) || flight.includes('KLO') || flight.includes('MPH')) sandingTime = "\uc804\ub0a0 \uc7ac\uc548\ub0b4";
                    else sandingTime = flight ? "21:00" : "";
                    allItems.push({ name: flight ? `\uacf5\ud56d \uc0cc\ub529 (${flight})` : `\uacf5\ud56d \uc0cc\ub529`, date: item.sendingDate || res.sendingDate || item.date, time: sandingTime, count: item.count, details: item.details, _res: res });
                }
            } else {
                // 점보크랩 단독 아이템 제거 (호핑투어 카드에 이미 포함됨)
                const isStandaloneJumbo = (itemName.includes('점보크랩') || itemName.toLowerCase().includes('jumbo'))
                    && !itemName.includes('호핑') && !itemName.includes('블랙펄');
                if (!isStandaloneJumbo) allItems.push({...item, _res: res});
            }
        });

        // 🔧 isPackage 없어도 패키지 날짜 있으면 표시 (admin-quote-maker 등)
        if (!packageAdded && (res.pickupDate || res.hoppingDate || res.malumDate || res.oneDayDate || res.whaleDate)) {
            buildPackageSchedule(res, defaultCount, allItems);
        }
    }

    async function loadVoucher() {
        const urlParams = new URLSearchParams(window.location.search);
        const resId = urlParams.get('id');
        const type = urlParams.get('type');
        const contact = urlParams.get('contact');
        if (!resId && !contact) return;
        try {
            let resList = [];
            if (contact) {
                // ✅ 모든 예약확정 건 로드 (기존: snap.docs[0]만 → 버그)
                const q = query(collection(db, "reservations"), where("contact", "==", contact), where("status", "==", "\uc608\uc57d\ud655\uc815"));
                const snap = await getDocs(q);
                resList = snap.docs.map(d => d.data());
            } else {
                const collectionName = (type === 'quick') ? "quick_vouchers" : "reservations";
                const docSnap = await getDoc(doc(db, collectionName, resId));
                if (docSnap.exists()) resList = [docSnap.data()];
            }
            if (resList.length === 0) return;

            const res = resList[0];
            const isQuick = (type === 'quick');
            const korName = res.customerKorName || '-';
            const engName = res.engName || '-';
            document.getElementById('v-name').innerText = (isQuick && korName.includes('(')) ? korName : `${korName} (${engName})`;
            document.getElementById('v-agency').innerText = res.contact || '-';
            if (isQuick) {
                document.getElementById('label-agency').innerText = '\uad6c\ub9e4\uccb4';
                document.getElementById('v-exchange').innerText = res.exchangeAmount || '-';
                document.getElementById('v-pax').innerText = res.paxInfo || '-';
            } else {
                document.getElementById('label-agency').innerText = '\uc5f0\ub77d\uc218';
                document.getElementById('v-exchange').innerText = res.exchangeAmount || '-';
                const totalPax = res.items && res.items[0] ? `${res.items[0].count}\uba85` : '-';
                document.getElementById('v-pax').innerText = totalPax;
            }

            let allItems = [];
            resList.forEach(r => processResItems(r, allItems)); // ✅ 모든 예약 처리
            allItems.sort((a, b) => (a.date || "").localeCompare(b.date || "") || (a.time || "00:00").localeCompare(b.time || "00:00"));

            const list = document.getElementById('item-list');
            list.innerHTML = allItems.map(item => {
                const itemRes = item._res || res; // ✅ 각 아이템의 부모 예약 기준 안내문
                const isPickupSending = item.name.includes('\ud53d\uc5c5') || item.name.includes('\uc0cc\ub529');
                let displayName = item.name;
                const lowName = displayName.toLowerCase();
                if (lowName.includes('malum') || displayName.includes('\ub9d0\ub8f8\ud30c\ud2f0')) {
                    displayName = "\uc2dc\ud06c\ub9bf\uac00\ub4e0 \ub9d0\ub8f8\ud30c\ud2f0";
                } else if (lowName.includes('hopping')) {
                    if (lowName.includes('\ubcf4\ub77c\uc544\uc7ac') || lowName.includes('\uce74\ub77c\ubc14\uc624')) displayName = "\ubcf4\ub77c\uc544\uc7ac \ud638\ud551\ud22c\uc5b4";
                    else if (lowName.includes('\uc810\ubcf4') || lowName.includes('\uc810\uc2ec')) displayName = "\ube14\ub799\ud384 \ud638\ud551\ud22c\uc5b4 (+\uc810\ubcf4\ud06c\ub7a9 \uc810\uc2ec)";
                    else displayName = "\ube14\ub799\ud384 \uc694\ud2b8\ud638\ud551\ud22c\uc5b4";
                }
                return `
                <div class="item-card">
                    <div class="item-header">
                        <div class="item-name">${displayName}</div>
                        <div class="item-status">\ud655\uc815</div>
                    </div>
                    <div class="item-details">
                        <div class="detail-point"><span class="material-icons">calendar_today</span><b>\ub0a0\uc9dc</b>${item.date || '-'}</div>
                        ${(!isPickupSending && item.time && item.time.trim()) ? `<div class="detail-point"><span class="material-icons">access_time</span><b>\uc2dc\uac04</b>${item.time}</div>` : ''}
                        <div class="detail-point"><span class="material-icons">people</span><b>\uc778\uc6d0</b>${item.count || '-'}\uba85</div>
                    </div>
                    ${item.noGuidance ? '' : getTourGuidance(displayName, item, itemRes)}
                </div>
            `;}).join('');
            document.getElementById('loading').style.display = 'none';
        } catch (e) { console.error(e); }
    }
    loadVoucher();

</script>
</body>
</html>
