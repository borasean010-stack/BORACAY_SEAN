<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 블로그 프롬프트 생성기 (무료 GPT용)</title>
    <style>
        body { font-family: 'Pretendard', sans-serif; background: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { color: #ff6a00; font-size: 24px; margin-top: 0; border-bottom: 2px solid #eee; padding-bottom: 15px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: #555; }
        select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; outline: none; }
        select:focus { border-color: #ff6a00; }
        select:disabled { background: #eee; cursor: not-allowed; }
        .btn-copy { background: #ff6a00; color: white; border: none; padding: 15px; width: 100%; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .btn-copy:hover { background: #e65c00; }
        .btn-copy:active { transform: scale(0.98); }
        textarea { width: 100%; height: 300px; padding: 15px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; line-height: 1.6; resize: vertical; box-sizing: border-box; background: #f9f9f9; margin-top: 10px; }
        .loading { display: none; color: #ff6a00; font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🤖 챗GPT 전용 프롬프트 생성기</h1>
    <p style="color:#666; margin-bottom: 25px;">오너님의 찐 프롬프트와 상품 팩트 데이터(JSON)를 결합하여 완벽한 포스팅 원고를 자동 생성합니다.</p>

    <div class="form-group">
        <label for="prompt-type">1. 작성 목적(프롬프트 종류) 선택</label>
        <select id="prompt-type">
            <option value="type1">1. 상세페이지 기반 홍보 및 설명글 (메인)</option>
            <option value="type2">2. 투어 상품 정보성 글 (찐정보/꿀팁 위주)</option>
            <option value="type3">3. 투어 상품 사진 퍼가기 (사진 중심 배치 및 스토리텔링)</option>
            <option value="type4">4. 보라카이 실시간 현지 정보 (날씨/환율/화이트비치 단독)</option>
        </select>
    </div>

    <div class="form-group" id="product-select-group">
        <label for="product-select">2. 작성할 투어 상품 선택</label>
        <select id="product-select">
            <option value="">-- 상품을 선택하세요 --</option>
            <optgroup label="핵심 투어 및 픽업샌딩">
                <option value="pickup-sending">공항 왕복 픽업샌딩</option>
                <option value="hopping-tour">블랙펄 요트호핑투어</option>
                <option value="whale-shark-tour">리버타드 고래상어 투어</option>
                <option value="malumpati">시크릿가든 말룸파티 투어</option>
            </optgroup>
            <optgroup label="할인 패키지">
                <option value="package-signature">⭐ 시그니처 패키지</option>
                <option value="package-tour">고래팩 시리즈</option>
                <option value="tour-combo-pack">픽샌팩 & 일반 패키지</option>
            </optgroup>
            <optgroup label="마사지 및 스파">
                <option value="spa">에스파 (S-SPA)</option>
                <option value="poseidon">포세이돈 스파</option>
                <option value="maris">마리스 스파</option>
                <option value="boraspa">보라스파</option>
                <option value="luna">루나 스파</option>
                <option value="helios">헬리오스 스파</option>
                <option value="kabayan">카바얀 스파</option>
                <option value="aspa">아유르베다 스파</option>
            </optgroup>
            <optgroup label="기타 액티비티">
                <option value="bora-ajae-hopping">보라아재 호핑투어</option>
                <option value="parasailing">파라세일링</option>
                <option value="jetski">제트스키</option>
                <option value="scuba-diving">체험다이빙</option>
                <option value="helmet-diving">헬멧다이빙</option>
                <option value="land-tour">보라카이 랜드투어</option>
                <option value="freediving">프리다이빙 체험</option>
                <option value="jl-snap">JL 스냅사진 촬영</option>
                <option value="golf">페어웨이 골프클럽</option>
            </optgroup>
        </select>
    </div>

    <div id="loading" class="loading">데이터를 불러오는 중입니다...</div>
    
    <button class="btn-copy" id="btn-copy" style="display:none;" onclick="copyPrompt()">복사하고 챗GPT 열기</button>

    <div class="form-group" style="margin-top: 20px;">
        <label>생성된 프롬프트 미리보기</label>
        <textarea id="prompt-output" readonly placeholder="옵션을 선택하면 이곳에 프롬프트가 완성됩니다."></textarea>
    </div>
</div>

<script>
    const prompts = {
        type1: `당신은 보라카이 여행상품 전문 콘텐츠 에디터이며 네이버 SEO와 네이버 AI 메이트 최적화 전문가입니다.

내가 보내는 상세페이지 팩트 데이터를 먼저 끝까지 분석한 후 내용을 이해합니다.
절대로 원문을 복사하거나 문장을 그대로 사용하지 않습니다.
상세페이지를 이해한 뒤 같은 내용을 사람이 새롭게 작성한 것처럼 재구성합니다.

1. 상세페이지 분석
상품 소개, 특징, 진행 순서, 이용 시간, 포함사항, 불포함사항, 준비물, 이용 혜택, 환불 규정, 주의사항, FAQ 등 파악.
없는 내용은 절대로 임의로 추가하지 않습니다. 추측하지 않습니다.

2. 작성 원칙
같은 의미를 새로운 문장으로, 사람이 직접 쓴 자연스러운 글로 작성합니다. 과장 표현(최고의, 무조건, 역대급 등) 금지.

3. 네이버 SEO 최적화 및 글 구성
제목: 검색 키워드를 자연스럽게 포함
구성: 상품 소개 -> 추천 대상 -> 상품 특징(혜택 녹여내기) -> 이용 순서 -> 포함/불포함/준비물 -> FAQ(7개 이상) -> 확인 및 주의사항 -> 마무리
경쟁업체 언급 금지, 혜택 단순 나열 금지.

4. 최종 출력
① SEO 제목 (5개) ② 대표 썸네일 문구 (5개) ③ 메타 설명 (120~160자) ④ 본문 ⑤ FAQ ⑥ 해시태그 (20개)

==================================================
아래는 분석해야 할 [상품 상세페이지 팩트 데이터(JSON)] 입니다. 
이 데이터를 바탕으로 위 가이드에 맞춰 네이버 포스팅 원고를 작성해 주세요!

`,

        type2: `당신은 보라카이 여행 정보만을 진정성 있게 전달하는 '네이버 여행 인플루언서'이자 찐정보(꿀팁) 마스터입니다.

절대 대놓고 광고하는 느낌이 나지 않아야 하며, "보라카이 여행을 준비하는 사람들이 진짜로 궁금해할 꿀팁과 정보"를 중심으로 글을 작성합니다.

1. 작성 원칙
- 업체를 노골적으로 칭찬하거나 '예약하세요'라는 식의 영업성 멘트를 완전히 배제합니다.
- 마치 본인이 직접 경험해보고 느낀 점과 주의할 점, 여행 전 미리 알아두면 좋은 꿀팁을 전수하는 느낌으로 작성합니다.
- 데이터에 제공된 '포함사항', '불포함사항', '준비물'을 바탕으로 "이건 꼭 챙겨라", "이건 조심해라" 같은 실질적인 정보를 강조합니다.
- 문체는 친근하고 진정성 있는 블로거 말투(~했어요, ~더라고요, ~꿀팁 알려드릴게요)를 사용합니다.

2. 글 구성
- 제목: 정보성을 강조한 제목 (예: "보라카이 픽업샌딩 예약 전 무조건 알아야 할 3가지 꿀팁")
- 도입부: 여행 준비하면서 겪는 고민 공감 및 글을 쓰는 이유
- 찐정보 1: 상품의 핵심 장점을 '내가 느낀 좋았던 점'으로 승화하여 작성
- 찐정보 2: 꿀팁 및 주의사항 (데이터의 불포함사항이나 준비물을 기반으로 팁 제공)
- 찐정보 3: 일정이나 스케줄 관련 꼭 알아둬야 할 동선 정보
- 요약: 팩트 데이터를 표나 깔끔한 리스트로 요약 (가격, 소요시간 등)
- 마무리: 독자에게 여행을 잘 다녀오라는 따뜻한 격려

3. 최종 출력
① 정보성 SEO 제목 (3개) ② 본문 ③ 정보성 해시태그 (15개)

==================================================
아래는 분석해야 할 [상품 팩트 데이터(JSON)] 입니다. 
광고 느낌을 빼고 오직 위 데이터의 팩트를 기반으로 '찐정보성 꿀팁 글'을 작성해 주세요!

`,

        type3: `당신은 시각적 요소를 매우 중요시하는 사진 중심의 '포토 에세이' 스타일 여행 블로거입니다.

이 프롬프트의 목적은 "다양한 현장 사진을 적재적소에 배치하면서, 사진과 완벽하게 어우러지는 스토리텔링 원고를 작성"하는 것입니다.

1. 사진 배치 가이드 라인 (매우 중요)
글 중간중간에 정확히 어떤 사진이 들어가야 하는지 [사진: 0000 하는 모습] 형태로 명시해야 합니다.
예시:
[사진 1: 공항 밖에서 보라카이션 피켓을 들고 기다리는 직원 사진]
이곳 칼리보 공항 밖으로 나오시면 직원이 이렇게 피켓을 들고 계십니다...

[사진 2: 에어컨이 빵빵한 전용 밴 차량 내부 사진]
더운 날씨에 밴에 타자마자 시원한 에어컨 바람이...

2. 작성 원칙
- 제공된 팩트 데이터(스케줄, 포함사항, 혜택 등)를 바탕으로 시간의 흐름(이용 순서)에 따라 글을 전개합니다.
- 각 스케줄 단계마다 그에 맞는 적절한 사진 삽입 위치를 지시표([사진: ~])로 남기고, 바로 아래에 해당 사진을 설명하는 듯한 생생한 글을 작성합니다.
- 마치 독자가 옆에서 사진을 보며 현장을 같이 체험하는 듯한 생동감 있는 묘사를 사용하세요.
- 데이터에 없는 거짓 혜택이나 일정을 지어내지 마세요.

3. 글 구성
- 제목: 시각적 호기심을 유발하는 제목
- 도입부: 전체 분위기를 보여주는 메인 사진 지시표 + 도입 스토리
- 본문(스케줄에 따른 전개): 시간 순서대로 [사진 지시표] + [사진에 맞는 팩트 기반 스토리텔링] 반복 (최소 5~7개의 사진 배치 포인트 생성)
- 꿀팁/안내사항: 하단에 텍스트로 깔끔하게 주의사항 및 팩트 요약
- 마무리

4. 최종 출력
① 사진 중심 스토리텔링 SEO 제목 (3개) ② 사진 지시표가 포함된 본문 ③ 해시태그 (15개)

==================================================
아래는 분석해야 할 [상품 팩트 데이터(JSON)] 입니다. 
이 데이터를 바탕으로 지시된 위치에 알맞은 사진을 넣을 수 있도록 '사진 중심의 스토리텔링 원고'를 작성해 주세요!

`,

        type4: `당신은 보라카이 현지 소식을 가장 빠르고 정확하게 전하는 여행 인플루언서입니다.

이 프롬프트의 목적은 "오늘의 보라카이 날씨, 환율, 그리고 화이트비치 현황"을 하나로 묶어 여행객에게 실시간 현지 정보를 제공하는 정보성 포스팅을 작성하는 것입니다.

1. 작성 원칙
- 특정 투어 상품을 광고하지 않습니다. 오직 '보라카이 여행을 준비 중인 분들'을 위한 순수 현지 정보만을 작성합니다.
- 문체는 생동감 넘치고 친근한 블로거 말투(~했어요, ~더라고요, 알려드릴게요!)를 사용합니다.
- 내가 방금 디몰을 걷고 화이트비치 선셋을 보고 온 것처럼 현장감 있게 묘사합니다.

2. 글 구성 및 데이터 괄호 사용법 (매우 중요)
- 제목: 오늘의 날씨와 환율 등 정보성이 강하게 드러나는 SEO 제목
- 도입부: "오늘 보라카이에서 전해드리는 실시간 소식입니다!" 같은 생동감 있는 인사말
- 날씨 브리핑: 오늘 날씨와 기온에 대한 설명. (단, 정확한 수치는 사용자가 채워 넣을 수 있도록 [오늘 최고 기온], [오늘 최저 기온], [현재 체감 날씨] 형식의 괄호로 남겨둡니다.)
- 환율 정보: 현재 페소 환율 및 환전 꿀팁. (수치는 [현재 디몰 100달러 환율], [오늘의 네이버 기준 환율] 로 남겨둡니다.)
- 화이트비치 상황: 녹조 유무, 파도 상태, 선셋의 아름다움 등 바다 상황 묘사. (이 부분도 [오늘의 화이트비치 상황] 이라는 괄호 지시어를 포함하여 작성합니다.)
- 꿀팁 방출: 건기/우기 옷차림이나 환전 시 주의할 점 등 유용한 정보 1~2개 추가
- 마무리: 다음 실시간 소식을 기대해 달라는 멘트

3. 최종 출력
① 날씨/환율/비치 SEO 제목 (3개) 
② 본문 (사용자가 괄호 부분만 수정해서 즉시 업로드할 수 있는 완벽한 템플릿 형태) 
③ 관련 해시태그 (15개)

==================================================
위 가이드라인에 맞춰 보라카이 실시간 현지 정보(날씨, 환율, 화이트비치)를 브리핑하는 완벽한 포스팅 원고 템플릿을 지금 바로 작성해 주세요!
(투어 데이터 분석은 필요 없으며, 독립적인 정보성 글로 작성합니다.)
`
    };

    const selectEl = document.getElementById('product-select');
    const typeEl = document.getElementById('prompt-type');
    const btnEl = document.getElementById('btn-copy');
    const outputEl = document.getElementById('prompt-output');
    const loadingEl = document.getElementById('loading');

    async function generatePrompt() {
        const type = typeEl.value;
        const slug = selectEl.value;
        
        // 4번 현지정보 모드일 경우 상품 선택 무시
        if (type === 'type4') {
            selectEl.disabled = true;
            selectEl.value = "";
            outputEl.value = prompts.type4;
            btnEl.style.display = 'block';
            return;
        } else {
            selectEl.disabled = false;
        }

        if (!slug) {
            outputEl.value = '';
            btnEl.style.display = 'none';
            return;
        }

        loadingEl.style.display = 'block';
        btnEl.style.display = 'none';
        outputEl.value = '';

        try {
            const response = await fetch('/api/content/' + slug + '.json');
            if (!response.ok) throw new Error('API 로드 실패');
            const data = await response.json();
            const dataStr = JSON.stringify(data, null, 2);
            
            const selectedPromptTemplate = prompts[type];
            const finalPrompt = selectedPromptTemplate + dataStr;
            outputEl.value = finalPrompt;
            btnEl.style.display = 'block';

        } catch (error) {
            outputEl.value = '데이터를 불러오는 중 오류가 발생했습니다: ' + error.message;
        } finally {
            loadingEl.style.display = 'none';
        }
    }

    selectEl.addEventListener('change', generatePrompt);
    typeEl.addEventListener('change', generatePrompt);

    function copyPrompt() {
        const text = outputEl.value;
        if (!text) return;
        
        navigator.clipboard.writeText(text).then(() => {
            alert('프롬프트 복사가 완료되었습니다!\n이제 챗GPT 창으로 이동합니다.');
            window.open('https://chatgpt.com', '_blank');
        }).catch(err => {
            alert('복사에 실패했습니다. 텍스트창 내용을 직접 복사해 주세요.');
        });
    }
</script>
</body>
</html>
