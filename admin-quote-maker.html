<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>견적서 메이커 - Boracay Sean</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        body { background: #f0f2f5; font-family: 'Pretendard', sans-serif; padding: 40px 20px; }
        .maker-container { max-width: 1000px; margin: 0 auto; background: #fff; border-radius: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); overflow: hidden; }
        .maker-header { background: #007aff; color: #fff; padding: 30px; display: flex; justify-content: space-between; align-items: center; }
        .maker-header h1 { margin: 0; font-size: 22px; font-weight: 800; }
        
        .maker-body { padding: 30px; }
        
        .item-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        .item-table th { text-align: left; padding: 15px 12px; border-bottom: 2px solid #eee; font-size: 14px; color: #888; }
        .item-table td { padding: 15px 12px; border-bottom: 1px solid #eee; vertical-align: middle; }
        
        .item-row select, .item-row input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px; font-size: 14px; box-sizing: border-box; transition: 0.2s; }
        .item-row select:focus, .item-row input:focus { border-color: #007aff; outline: none; }
        
        .btn-add { background: #f0f7ff; color: #007aff; border: 1px dashed #007aff; width: 100%; padding: 15px; border-radius: 12px; font-weight: 700; cursor: pointer; margin-bottom: 30px; transition: 0.2s; }
        .btn-add:hover { background: #e0eeff; }

        .total-display { background: #f8f9fa; border-radius: 15px; padding: 25px; text-align: right; margin-bottom: 30px; }
        .total-display .label { font-size: 14px; color: #666; }
        .total-display .amount { font-size: 32px; font-weight: 900; color: #007aff; margin-top: 5px; }

        .maker-footer { padding: 0 30px 30px; display: flex; gap: 10px; }
        .btn-submit { flex: 2; background: #111; color: #fff; border: none; padding: 18px; border-radius: 12px; font-size: 18px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-close { flex: 1; background: #eee; color: #666; border: none; padding: 18px; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; }
        
        .btn-remove { color: #ff4b4b; background: none; border: none; cursor: pointer; font-size: 20px; }

        /* 패키지 일정 섹션 */
        #pkg-schedule-section { display: none; background: #fffcf9; border: 1.5px solid #ffe0c2; border-radius: 20px; padding: 28px; margin-bottom: 30px; }
        #pkg-schedule-section h3 { font-size: 17px; font-weight: 800; color: #ff6a00; margin: 0 0 20px; display: flex; align-items: center; gap: 8px; }
        .sched-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .sched-field { display: flex; flex-direction: column; gap: 6px; position: relative; }
        .sched-field label { font-size: 13px; font-weight: 700; color: #555; }
        .sched-field input[type=text] { padding: 11px 14px; border: 1.5px solid #eee; border-radius: 10px; font-size: 14px; font-family: inherit; background: #fafafa; transition: 0.2s; box-sizing: border-box; }
        .sched-field input[type=text]:focus { border-color: #ff6a00; background: white; outline: none; box-shadow: 0 0 0 3px rgba(255,106,0,0.1); }
        .sched-field input[readonly] { cursor: pointer; }
        .sched-section-title { font-size: 14px; font-weight: 800; color: #333; padding: 12px 0 6px; border-top: 1px dashed #eee; margin-top: 10px; grid-column: 1 / -1; }

        /* 달력 피커 */
        .calendar-picker { display: none; position: relative; background: white; border: 1px solid #eee; border-radius: 16px; padding: 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.12); width: 100%; max-width: 100%; margin-top: 8px; box-sizing: border-box; z-index: 100; }
        .calendar-picker.active { display: block; }
        .cp-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
        .cp-header strong { font-size: 14px; font-weight: 800; color: #333; }
        .cp-nav-btn { background: none; border: none; font-size: 18px; cursor: pointer; color: #555; padding: 4px 10px; border-radius: 8px; transition: 0.2s; }
        .cp-nav-btn:hover { background: #fff1e6; color: #ff6a00; }
        .cp-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
        .cp-day-header { font-size: 11px; color: #bbb; font-weight: 700; padding-bottom: 8px; }
        .cp-day { padding: 9px 0; font-size: 13px; font-weight: 600; cursor: pointer; border-radius: 8px; transition: 0.2s; }
        .cp-day:hover:not(.empty):not(.disabled) { background: #fff1e6; color: #ff6a00; }
        .cp-day.selected { background: #ff6a00 !important; color: white !important; font-weight: 800; }
        .cp-day.disabled { color: #ddd; cursor: default; }
        .cp-day.today { border: 1.5px solid #ff6a00; color: #ff6a00; font-weight: 800; }
        .cp-day.empty { cursor: default; }

        /* 투어 날짜 카드 */
        .tour-date-cards { display: flex; flex-direction: column; gap: 10px; grid-column: 1 / -1; }
        .tour-date-card { background: white; border: 1.5px solid #eee; border-radius: 12px; padding: 14px 16px; display: flex; align-items: flex-start; gap: 14px; }
        .tour-date-card label { font-size: 13px; font-weight: 700; color: #444; min-width: 220px; padding-top: 11px; }
        .tour-date-card .cal-wrap { flex: 1; position: relative; }
        .tour-date-card .cal-wrap input { width: 100%; padding: 9px 12px; border: 1.5px solid #eee; border-radius: 8px; font-size: 13px; font-family: inherit; background: #fafafa; cursor: pointer; box-sizing: border-box; }
        .tour-date-card .cal-wrap input:focus { border-color: #ff6a00; outline: none; background: white; }
    </style>
</head>
<body>

<div class="maker-container">
    <div class="maker-header">
        <h1>📝 맞춤 견적서 메이커</h1>
        <div style="font-size: 14px; opacity: 0.8;">Admin Mode</div>
    </div>

    <div class="maker-body">
        <div style="margin-bottom: 25px; padding: 15px; background: #f0f7ff; border-radius: 12px; color: #007aff; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 10px;">
            <span class="material-icons">info</span>
            상품을 선택하면 해당 상품의 옵션(마사지 종류 등)이 자동으로 활성화됩니다. 패키지 상품 포함 시 투어 일정 입력 섹션이 활성화됩니다.
        </div>

        <table class="item-table">
            <thead>
                <tr>
                    <th width="300">상품 선택</th>
                    <th width="100">인원</th>
                    <th width="300">종류 / 옵션</th>
                    <th width="180" style="text-align:right;">소계</th>
                    <th width="50"></th>
                </tr>
            </thead>
            <tbody id="item-tbody">
                <!-- Rows injected here -->
            </tbody>
        </table>

        <button class="btn-add" onclick="addItemRow()">
            <span class="material-icons" style="vertical-align: middle; font-size: 18px;">add_circle</span> 상품 항목 추가
        </button>

        <!-- ✅ 패키지 투어 일정 섹션 (booking-form과 동일) -->
        <div id="pkg-schedule-section">
            <h3>📅 패키지 투어 일정 입력</h3>

            <div class="sched-grid">
                <!-- ✈️ 항공 & 리조트 -->
                <div class="sched-section-title" style="border-top:none; padding-top:0;">✈️ 항공 및 리조트 정보</div>

                <div class="sched-field">
                    <label>픽업 날짜 (공항→보라카이) *</label>
                    <input type="text" id="pkg-pickup-date" placeholder="날짜 선택" readonly onclick="openCalendar(this)">
                    <div class="calendar-picker"></div>
                </div>
                <div class="sched-field">
                    <label>샌딩 날짜 (보라카이→공항) *</label>
                    <input type="text" id="pkg-sending-date" placeholder="날짜 선택" readonly onclick="openCalendar(this)">
                    <div class="calendar-picker"></div>
                </div>
                <div class="sched-field">
                    <label>픽업 항공편명 (인천→칼리보)</label>
                    <input type="text" id="pkg-pickup-flight" placeholder="예: TW125">
                </div>
                <div class="sched-field">
                    <label>샌딩 항공편명 (칼리보→인천)</label>
                    <input type="text" id="pkg-sending-flight" placeholder="예: TW126">
                </div>
                <div class="sched-field">
                    <label>픽업 리조트 (첫날 숙소)</label>
                    <input type="text" id="pkg-pickup-resort" placeholder="예: 헤난 가든">
                </div>
                <div class="sched-field">
                    <label>샌딩 리조트 (마지막 숙소)</label>
                    <input type="text" id="pkg-sending-resort" placeholder="예: 헤난 가든">
                </div>

                <!-- 📅 투어 날짜 -->
                <div class="sched-section-title">📅 투어 이용 날짜</div>

                <div class="tour-date-cards">
                    <div class="tour-date-card" id="pkg-oneday-card" style="display:none;">
                        <label>🌊 원데이 투어 이용일 (말룸+고래상어)</label>
                        <div class="cal-wrap">
                            <input type="text" id="pkg-oneday-date" placeholder="날짜 선택" readonly onclick="openCalendar(this)">
                            <div class="calendar-picker"></div>
                        </div>
                    </div>
                    <div class="tour-date-card" id="pkg-hopping-card" style="display:none; flex-direction:column; align-items:stretch; gap:10px;">
                        <div style="display:flex; align-items:center; gap:14px; width:100%;">
                            <label style="min-width: 220px; font-weight: 700; color: #444; padding-top:0;">⛵ 블랙펄 호핑투어 이용일</label>
                            <div class="cal-wrap" style="flex:1;">
                                <input type="text" id="pkg-hopping-date" placeholder="날짜 선택" readonly onclick="openCalendar(this)">
                                <div class="calendar-picker"></div>
                            </div>
                        </div>
                        <div id="pkg-jumbo-group" style="display: flex; align-items: center; gap: 15px; background: #fffcf0; border: 1.5px solid #ffe699; padding: 10px 14px; border-radius: 8px; margin-top: 5px; width: 100%; box-sizing: border-box;">
                            <label style="display: flex; align-items: center; gap: 8px; font-weight: 800; cursor: pointer; margin-bottom: 0; min-width: auto; padding-top: 0; width: auto;">
                                <input type="checkbox" id="pkg-jumbo-check" onchange="toggleJumboOption(this)" style="width: 18px; height: 18px; accent-color: #ff6a00;">
                                <span>🦀 점보크랩 추가 <strong style="color: #ff6a00;">(현지불 $30/인)</strong></span>
                            </label>
                            <div id="pkg-jumbo-fields" style="display: none; align-items: center; gap: 8px; flex: 1;">
                                <span style="font-size: 13px; color: #555;">인원:</span>
                                <select id="pkg-jumbo-qty" style="padding: 6px 10px; border: 1.5px solid #eee; border-radius: 6px; font-size: 13px;">
                                    <option value="1">1명</option>
                                    <option value="2">2명</option>
                                    <option value="3">3명</option>
                                    <option value="4">4명</option>
                                    <option value="5">5명</option>
                                    <option value="6">6명</option>
                                    <option value="7">7명</option>
                                    <option value="8">8명</option>
                                    <option value="9">9명</option>
                                    <option value="10">10명 이상</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="tour-date-card" id="pkg-malum-card" style="display:none;">
                        <label>🌿 시크릿가든 말룸파티 이용일</label>
                        <div class="cal-wrap">
                            <input type="text" id="pkg-malum-date" placeholder="날짜 선택" readonly onclick="openCalendar(this)">
                            <div class="calendar-picker"></div>
                        </div>
                    </div>
                    <div class="tour-date-card" id="pkg-whale-card" style="display:none;">
                        <label>🐋 리버타드 고래상어 투어 이용일</label>
                        <div class="cal-wrap">
                            <input type="text" id="pkg-whale-date" placeholder="날짜 선택" readonly onclick="openCalendar(this)">
                            <div class="calendar-picker"></div>
                        </div>
                    </div>
                </div>

                <div class="sched-field" style="grid-column: 1 / -1;">
                    <label>환전 요청 금액 (달러 → 페소)</label>
                    <input type="text" id="pkg-exchange-amount" placeholder="예: 100달러">
                </div>
            </div>
        </div>

        <div class="total-display">
            <div class="label">최종 합계 금액</div>
            <div class="amount" id="total-amount">₩ 0</div>
        </div>
    </div>

    <div class="maker-footer">
        <button class="btn-close" onclick="window.close()">닫기</button>
        <button class="btn-submit" onclick="submitQuote()">
            <span class="material-icons">link</span> 견적서 생성 및 링크 복사
        </button>
    </div>
</div>

<script type="module" src="admin-quote-maker.js"></script>
</body>
</html>
