<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>시스템 데이터 초기화</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@600;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #fff; }
        .box { border: 2px solid #ff6a00; padding: 50px; border-radius: 30px; text-align: center; }
        h1 { color: #ff6a00; font-size: 24px; margin-bottom: 10px; }
        #log { font-size: 16px; color: #666; margin-bottom: 20px; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #ff6a00; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .btn { display: none; padding: 12px 24px; background: #111; color: white; text-decoration: none; border-radius: 10px; font-weight: 800; }
    </style>
</head>
<body>
    <div class="box">
        <div id="loader" class="loader"></div>
        <h1>데이터 초기화 진행 중</h1>
        <div id="log">데이터베이스 연결 확인 중...</div>
        <a href="admin.html" id="homeBtn" class="btn">관리자 화면으로 돌아가기</a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDkDjmGKQDF-0Vu2S_qtI6W5Hf2-j4tKcM",
            authDomain: "boracaysean-69b4a.firebaseapp.com",
            projectId: "boracaysean-69b4a",
            storageBucket: "boracaysean-69b4a.firebasestorage.app",
            messagingSenderId: "806585874771",
            appId: "1:806585874771:web:64a094d241730ca38109a6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function clean() {
            const logEl = document.getElementById('log');
            const loader = document.getElementById('loader');
            const btn = document.getElementById('homeBtn');

            try {
                const snap = await getDocs(collection(db, "reservations"));
                if (snap.empty) {
                    logEl.innerText = "삭제할 데이터가 이미 없습니다.";
                } else {
                    let count = 0;
                    for (const d of snap.docs) {
                        await deleteDoc(doc(db, "reservations", d.id));
                        count++;
                        logEl.innerText = `${count}개의 데이터 삭제 완료...`;
                    }
                    logEl.innerHTML = `<b>총 ${count}개</b>의 데이터를 모두 삭제했습니다.`;
                }
            } catch (e) {
                logEl.innerText = "오류 발생: " + e.message;
            } finally {
                loader.style.display = 'none';
                btn.style.display = 'inline-block';
            }
        }

        clean();
    </script>
</body>
</html>
