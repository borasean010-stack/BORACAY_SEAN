<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 | BORACAY SEAN</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.0/kakao.min.js" integrity="sha384-l68G9m6HS8uR7C/5L94K8N08O0t8TzU+A0fS2x5W5F9z7Vz0O+6x1H6Z8M2N5R1" crossorigin="anonymous"></script>
    <style>
        :root {
            --primary-color: #ff6a00;
            --text-color: #333;
            --bg-gray: #f8f9fa;
            --border-color: #e5e5e5;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-gray);
            font-family: 'Pretendard', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .login-wrapper {
            width: 100%;
            max-width: 480px;
            padding: 20px;
        }

        .login-container {
            background: #fff;
            padding: 60px 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        .login-header {
            margin-bottom: 40px;
        }

        .login-header img {
            width: 120px;
            height: auto;
            margin-bottom: 15px;
        }

        .login-header h1 {
            font-size: 24px;
            font-weight: 900;
            color: var(--primary-color);
            letter-spacing: -1px;
            margin: 0;
        }

        .login-header p {
            font-size: 15px;
            color: #666;
            margin-top: 10px;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 12px;
            text-align: left;
        }

        .form-group input {
            width: 100%;
            height: 54px;
            padding: 0 20px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 15px;
            color: var(--text-color);
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: var(--primary-color);
        }

        .btn-login {
            width: 100%;
            height: 54px;
            background-color: var(--primary-color);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 20px;
            transition: opacity 0.2s;
        }

        .btn-login:hover {
            opacity: 0.9;
        }

        .login-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            font-size: 14px;
            color: #888;
        }

        .login-options a {
            color: #888;
            text-decoration: none;
        }

        .login-options a:hover {
            text-decoration: underline;
        }

        .sns-login {
            margin-top: 40px;
        }

        .sns-login-title {
            display: flex;
            align-items: center;
            font-size: 13px;
            color: #bbb;
            margin-bottom: 20px;
        }

        .sns-login-title::before,
        .sns-login-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background-color: #eee;
        }

        .sns-login-title span {
            padding: 0 15px;
        }

        .kakao-btn {
            width: 100%;
            height: 54px;
            background-color: #fee500;
            border: none;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 800;
            color: #3c1e1e;
        }

        .kakao-btn img {
            width: 20px;
        }

        .login-footer {
            margin-top: 30px;
            text-align: center;
            font-size: 13px;
            color: #bbb;
        }

        .login-footer a {
            color: #bbb;
            text-decoration: none;
            margin: 0 10px;
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-container">
            <div class="login-header">
                <a href="index.html">
                    <img src="logo.png" alt="Boracay Sean Logo">
                </a>
                <h1>BORACAY SEAN</h1>
                <p>보라카이션 비즈니스 채널에 오신 것을 환영합니다.</p>
            </div>

            <form onsubmit="handleAdminLogin(event)">
                <div class="form-group">
                    <input type="text" id="adminId" placeholder="아이디" required>
                </div>
                <div class="form-group">
                    <input type="password" id="adminPw" placeholder="비밀번호" required>
                </div>
                <button type="submit" class="btn-login">로그인</button>
            </form>

            <div class="login-options">
                <label style="display: flex; align-items: center; gap: 5px; cursor: pointer;">
                    <input type="checkbox" style="width: 16px; height: 16px; border-radius: 4px;"> 아이디 저장
                </label>
                <div>
                    <a href="#">비밀번호 찾기</a>
                    <span style="margin: 0 8px; color: #eee;">|</span>
                    <a href="index.html">홈으로 가기</a>
                </div>
            </div>

            <div class="sns-login">
                <div class="sns-login-title">
                    <span>간편 로그인</span>
                </div>
                <button onclick="loginWithKakao()" class="kakao-btn">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/e/e3/KakaoTalk_logo.svg" alt="Kakao">
                    카카오로 로그인
                </button>
            </div>
        </div>
        <div class="login-footer">
            <a href="#">이용약관</a>
            <a href="#">개인정보처리방침</a>
            <p style="margin-top: 10px;">© BORACAY SEAN. All rights reserved.</p>
        </div>
    </div>

    <script>
        const KAKAO_KEY = '9e8b2d2be22f60f1cc512d61d6ba6991';
        const REDIRECT_URI = 'https://boracay-sean.pages.dev/login.html';

        if (!Kakao.isInitialized()) Kakao.init(KAKAO_KEY);

        function loginWithKakao() {
            Kakao.Auth.authorize({
                redirectUri: REDIRECT_URI
            });
        }

        function handleAdminLogin(e) {
            e.preventDefault();
            const id = document.getElementById('adminId').value;
            const pw = document.getElementById('adminPw').value;

            // 실제 운영시에는 Firebase Auth 등을 사용해야 함
            const admins = { 
                'admin': 'sean1234', 
                'sean': 'sean1' 
            };

            if(admins[id] && admins[id] === pw) {
                localStorage.setItem('isAdmin', 'true');
                localStorage.setItem('adminId', id);
                alert('관리자로 로그인되었습니다.');
                location.href = 'admin.html';
            } else {
                alert('아이디 또는 비밀번호가 일치하지 않습니다.');
            }
        }

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');

            if (code) {
                const tempUser = { 
                    nickname: "보라카이션 손님", 
                    id: "kakao_" + Math.floor(Math.random() * 1000000) 
                };
                localStorage.setItem('kakao_user', JSON.stringify(tempUser));
                
                const directBuy = sessionStorage.getItem('directBuyItem');
                setTimeout(() => {
                    location.href = directBuy ? 'booking-form.html' : 'index.html';
                }, 500);
            }
        };
    </script>
</body>
</html>
