<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>맞춤 견적서 - Boracay Sean</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #ff6a00; --dark: #111; --gray: #f4f7f6; }
        body { font-family: 'Pretendard', sans-serif; background: #f0f2f5; margin: 0; padding: 40px 20px; color: #333; line-height: 1.6; }
        
        .quote-container { max-width: 600px; margin: 0 auto; background: #fff; border-radius: 30px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.1); }
        
        .quote-header { background: var(--dark); color: #fff; padding: 40px 30px; text-align: center; }
        .quote-header img { width: 70px; margin-bottom: 15px; }
        .quote-header h1 { margin: 0; font-size: 24px; font-weight: 900; letter-spacing: 2px; }
        .quote-header p { margin: 8px 0 0 0; opacity: 0.6; font-size: 13px; text-transform: uppercase; }

        .quote-body { padding: 30px; }
        
        .section-title { font-size: 18px; font-weight: 800; margin: 30px 0 20px; display: flex; align-items: center; gap: 10px; color: var(--dark); }
        .section-title::before { content: ''; width: 4px; height: 18px; background: var(--primary); border-radius: 2px; }

        .detail-card { background: #fff; border: 1px solid #eee; border-radius: 20px; padding: 25px; margin-bottom: 20px; }
        .detail-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #f5f5f5; }
        .detail-row:last-child { border-bottom: none; }
        .detail-label { font-size: 15px; color: #666; font-weight: 600; }
        .detail-value { font-size: 16px; color: var(--dark); font-weight: 800; text-align: right; }
        .price-val { color: var(--primary); }

        .total-box { background: #fffaf5; border: 2px solid var(--primary); border-radius: 20px; padding: 25px; text-align: center; margin: 30px 0; }
        .total-box label { font-size: 14px; color: var(--primary); font-weight: 700; display: block; margin-bottom: 5px; }
        .total-box .amount { font-size: 32px; font-weight: 900; color: var(--dark); }

        .btn-main { background: var(--primary); color: #fff; border: none; padding: 20px; border-radius: 50px; font-size: 18px; font-weight: 800; width: 100%; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 10px 30px rgba(255,106,0,0.3); text-decoration: none; font-family: inherit; }
        .btn-main:hover { transform: translateY(-3px); box-shadow: 0 15px 40px rgba(255,106,0,0.4); }

        /* 홈페이지 스타일 커스텀 달력 */
        .custom-calendar { border: 1px solid #eee; border-radius: 20px; padding: 20px; background: #fff; margin-bottom: 15px; }
        .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .cal-header strong { font-size: 16px; font-weight: 800; }
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; text-align: center; }
        .cal-day-label { font-size: 11px; color: #bbb; font-weight: 800; padding-bottom: 10px; }
        .cal-date { padding: 10px 0; font-size: 13px; font-weight: 600; cursor: pointer; border-radius: 10px; transition: 0.2s; }
        .cal-date:hover:not(.disabled) { background: #fff1e6; color: var(--primary); }
        .cal-date.selected { background: var(--primary) !important; color: #fff !important; font-weight: 800; }
        .cal-date.disabled { color: #eee; cursor: not-allowed; }
        .cal-date.today { border: 1px solid var(--primary); }

        .input-group { margin-bottom: 25px; }
        .input-group label { display: block; font-size: 13px; color: #666; margin-bottom: 8px; font-weight: 700; }
        .input-group label span { color: var(--primary); margin-left: 3px; }
        .input-group input, .input-group select { width: 100%; padding: 15px; border: 1px solid #ddd; border-radius: 12px; font-size: 15px; box-sizing: border-box; background: #fff; font-family: inherit; }

        .product-spec-box { background: #f9fafb; border-radius: 24px; padding: 25px; margin-bottom: 30px; border: 1px solid #eee; }
        .product-spec-title { font-size: 16px; font-weight: 800; margin-bottom: 20px; color: var(--dark); display: flex; align-items: center; gap: 8px; }
        
        .bank-card { background: #f0f2f5; border-radius: 20px; padding: 25px; margin-top: 30px; text-align: center; }
        .bank-card .acc { font-size: 20px; font-weight: 900; color: var(--dark); }
        .copy-btn { display: inline-block; padding: 5px 12px; background: var(--dark); color: #fff; font-size: 11px; border-radius: 50px; cursor: pointer; margin-top: 10px; }

        #toast { visibility: hidden; min-width: 200px; background-color: #333; color: #fff; text-align: center; border-radius: 10px; padding: 12px; position: fixed; z-index: 2000; left: 50%; bottom: 50px; transform: translateX(-50%); font-size: 14px; }
        #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 50px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 50px; opacity: 1;} to {bottom: 0; opacity: 0;} }

        @media (max-width: 480px) { body { padding: 15px; } .quote-container { border-radius: 20px; } }
    </style>
</head>
<body>

<div id="toast">복사되었습니다.</div>

<div class="quote-container">
    <div class="quote-header">
        <img src="logo.png" alt="보라카이션">
        <h1>BORACAY_SEAN</h1>
        <p>Custom Travel Quotation</p>
    </div>

    <div class="quote-body">
        <div id="loading" style="text-align:center; padding:40px; color:#999;">견적 데이터를 불러오는 중...</div>
        
        <div id="main-content" style="display:none;">
            <div class="section-title">견적 상세 내역</div>
            <div class="detail-card" id="item-list-container"></div>

            <div class="total-box">
                <label>최종 합계 금액</label>
                <div class="amount" id="q-total">₩ 0</div>
            </div>

            <button class="btn-main" id="btn-show-form">
                <span class="material-icons">edit_note</span> 예약 정보 입력
            </button>

            <div id="info-form-section" style="display:none; margin-top:40px; border-top:2px dashed #eee; padding-top:40px;">
                <div class="section-title">예약자 기본 정보</div>
                <div class="input-group">
                    <label>대표자 성함 (한글)<span>*</span></label>
                    <input type="text" id="cust-kor-name" placeholder="실명을 입력해 주세요">
                </div>
                <div class="input-group">
                    <label>대표자 영문 이름 (여권과 동일)<span>*</span></label>
                    <input type="text" id="cust-eng-name" placeholder="예: HONG GILDONG">
                </div>
                <div class="input-group">
                    <label>카카오톡 ID 또는 연락처<span>*</span></label>
                    <input type="text" id="cust-contact" placeholder="안내 메시지를 받으실 수 있는 정보">
                </div>

                <div id="dynamic-product-fields"></div>

                <div class="section-title">결제 및 확정 안내</div>
                <div class="bank-card">
                    <div style="font-size:14px; color:#666; margin-bottom:5px;">입금 계좌 정보</div>
                    <div class="acc">국민은행 058137-04-003860</div>
                    <div style="font-size:15px; color:#888; margin-top:5px;">예금주: 윤오현 (보라카이션)</div>
                    <div class="copy-btn" onclick="copyText('058137-04-003860')">계좌번호 복사</div>
                </div>

                <div style="margin-top:30px;">
                    <button class="btn-main" id="btn-final-submit" style="background:#111;">
                        <span class="material-icons">check_circle</span> 입금 완료 및 예약 신청
                    </button>
                    <div style="text-align:center; font-size:13px; color:#666; margin-top:20px; line-height:1.6;">
                        정보를 모두 입력하신 후 '입금 완료' 버튼을 눌러주세요.<br>
                        <b style="color:var(--primary);">그리고 보라카이 션 카카오채널로 대표자분 성함 꼭 보내주세요!</b>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="success-overlay" class="success-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.98); flex-direction:column; align-items:center; justify-content:center; z-index:3000; text-align:center;">
    <span class="material-icons" style="font-size:80px; color:#00c73c; margin-bottom:20px;">check_circle</span>
    <div style="font-size:26px; font-weight:900; margin-bottom:15px;">예약 신청 완료!</div>
    <div style="color:#666; line-height:1.7; font-size:16px; margin-bottom:30px; padding:0 20px;">
        소중한 예약 감사합니다.<br>관리자가 입금을 확인하는 즉시 바우처를 보내드립니다.
    </div>
    <button class="btn-main" onclick="window.open('http://pf.kakao.com/_zBArM/chat', '_blank')" style="width:260px;">
        카카오톡으로 성함 보내기
    </button>
</div>

<script>
    window.copyText = (text) => {
        navigator.clipboard.writeText(text).then(() => {
            const toast = document.getElementById("toast");
            toast.className = "show";
            setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
        });
    };
</script>
<script type="module" src="quote.js"></script>
</body>
</html>
