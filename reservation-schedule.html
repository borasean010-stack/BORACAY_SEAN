<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>예약 확인서 - Boracay Sean</title>
    <meta property="og:title" content="예약 확인서 - Boracay Sean">
    <meta property="og:description" content="가장 완벽한 보라카이 여행의 시작, 보라카이션과 함께하세요.">
    <meta property="og:image" content="https://www.boracaysean.com/logo.png">
    <meta property="og:type" content="website">
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; background: #f0f2f5; margin: 0; padding: 40px 20px; color: #333; line-height: 1.6; }
        .voucher-container { max-width: 800px; margin: 0 auto; background: #fff; border-radius: 30px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.1); }
        .voucher-header { background: #ff6a00; color: #fff; padding: 40px; text-align: center; }
        .voucher-header img { width: 80px; margin-bottom: 15px; }
        .voucher-header h1 { margin: 0; font-size: 28px; font-weight: 900; letter-spacing: 2px; }
        .voucher-header p { margin: 10px 0 0 0; opacity: 0.6; font-size: 14px; }
        
        .voucher-body { padding: 40px; }
        .section-title { font-size: 18px; font-weight: 800; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; color: #ff6a00; }
        .section-title::before { content: ''; width: 4px; height: 18px; background: #ff6a00; border-radius: 2px; }
        
        .info-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; background: #f9fafb; padding: 25px; border-radius: 20px; margin-bottom: 40px; }
        .info-item label { display: block; font-size: 12px; color: #888; margin-bottom: 5px; font-weight: 600; }
        .info-item span { display: block; font-size: 16px; font-weight: 700; color: #111; }
        
        .item-card { border: 1px solid #eee; border-radius: 20px; padding: 25px; margin-bottom: 20px; transition: 0.3s; }
        .item-card:hover { border-color: #ff6a00; box-shadow: 0 10px 30px rgba(255,106,0,0.05); }
        .item-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; }
        .item-name { font-size: 18px; font-weight: 800; color: #111; }
        .item-status { background: #fff5eb; color: #ff6a00; font-size: 12px; font-weight: 800; padding: 6px 12px; border-radius: 50px; }
        
        .item-details { display: flex; flex-wrap: wrap; gap: 20px; }
        .detail-point { font-size: 14px; color: #666; display: flex; align-items: center; gap: 8px; }
        .detail-point b { color: #111; }

        .notice-box { background: #fff8e6; border-radius: 20px; padding: 25px; border: 1px solid #ffeeba; margin-top: 40px; }
        .notice-box h4 { margin: 0 0 10px 0; font-size: 15px; font-weight: 800; color: #856404; }
        .notice-box ul { margin: 0; padding-left: 20px; font-size: 13px; color: #856404; }
        
        .print-btn { position: fixed; bottom: 30px; right: 30px; background: #ff6a00; color: #fff; border: none; padding: 15px 30px; border-radius: 50px; font-weight: 800; cursor: pointer; box-shadow: 0 10px 30px rgba(255,106,0,0.3); transition: 0.3s; }
        .print-btn:hover { transform: translateY(-5px); background: #e65c00; }

        @media print {
            @page { margin: 10mm; }
            body { padding: 0; background: #fff; }
            .print-btn { display: none; }
            .voucher-container { box-shadow: none; border-radius: 0; max-width: 100%; width: 100%; margin: 0; }
            .voucher-header { padding: 20px; }
            .voucher-header img { width: 50px; }
            .voucher-header h1 { font-size: 20px; }
            .voucher-body { padding: 20px; }
            .info-grid { padding: 15px; margin-bottom: 20px; gap: 10px; }
            .info-item span { font-size: 14px; }
            .item-card { padding: 15px; margin-bottom: 10px; page-break-inside: avoid; }
            .item-name { font-size: 16px; }
            .section-title { margin-bottom: 10px; font-size: 16px; }
            .notice-box { padding: 15px; margin-top: 20px; }
            .notice-box ul { font-size: 11px; }
            /* 텍스트가 너무 많을 경우를 대비해 폰트 크기 미세 조정 */
            * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }
    </style>
</head>
<body>

<div class="voucher-container">
    <div class="voucher-header">
        <img src="logo.png" alt="Logo">
        <h1>BORACAY_SEAN</h1>
        <p>GUEST RESERVATION VOUCHER</p>
    </div>

    <div class="voucher-body">
        <div class="section-title">예약자 정보</div>
        <div class="info-grid">
            <div class="info-item"><label>대표자명</label><span id="guest-name">-</span></div>
            <div class="info-item"><label>연락처</label><span id="guest-contact">-</span></div>
            <div class="info-item"><label>예약구분</label><span id="res-id">-</span></div>
            <div class="info-item"><label>총 결제 금액</label><span id="total-price">-</span></div>
        </div>

        <div class="section-title">투어 및 액티비티 일정</div>
        <div id="item-list">
            <!-- JS Render -->
        </div>

        <div class="notice-box">
            <h4>안내 및 유의사항</h4>
            <ul>
                <li>모든 일정은 현지 기상 상황 및 업체 사정에 의해 다소 변경될 수 있습니다.</li>
                <li>픽업 시간 10분 전까지 약속 장소에서 대기해 주시기 바랍니다.</li>
                <li>문의 사항은 보라카이션 카카오톡 채널을 이용해 주세요.</li>
            </ul>
        </div>
    </div>
</div>

<button class="print-btn" onclick="window.print()">인쇄하기</button>

<script>
    document.addEventListener('DOMContentLoaded', async () => {
        const urlParams = new URLSearchParams(window.location.search);
        const resId = urlParams.get('id');
        const contact = urlParams.get('contact');
        const itemIndex = urlParams.get('itemIndex'); 
        
        if (!resId && !contact) {
            alert('예약 정보를 찾을 수 없습니다.');
            return;
        }

        const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js");
        const { getFirestore, doc, getDoc, collection, query, where, getDocs } = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js");

        const firebaseConfig = {
            apiKey: "AIzaSyDkDjmGKQDF-0Vu2S_qtI6W5Hf2-j4tKcM",
            authDomain: "boracaysean-69b4a.firebaseapp.com",
            projectId: "boracaysean-69b4a",
            storageBucket: "boracaysean-69b4a.firebasestorage.app",
            messagingSenderId: "806585874771",
            appId: "1:806585874771:web:64a094d241730ca38109a6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- 📅 날짜 조건 설정 ---
        const now = new Date();
        const offset = now.getTimezoneOffset() * 60000;
        const today = new Date(now.getTime() - offset);
        const todayStr = today.toISOString().split('T')[0];
        
        // 개별 액티비티용 15일 버퍼
        const fifteenDaysAgo = new Date(today);
        fifteenDaysAgo.setDate(today.getDate() - 15);
        const activityLimitStr = fifteenDaysAgo.toISOString().split('T')[0];

        try {
            let reservations = [];
            if (contact) {
                const q = query(collection(db, "reservations"), where("contact", "==", contact), where("status", "==", "예약확정"));
                const querySnapshot = await getDocs(q);
                reservations = querySnapshot.docs.map(d => ({ id: d.id, ...d.data() }));
            } else {
                const docSnap = await getDoc(doc(db, "reservations", resId));
                if (docSnap.exists()) reservations.push({ id: docSnap.id, ...docSnap.data() });
            }

            if (reservations.length > 0) {
                const mainRes = reservations[0];
                document.getElementById('guest-name').textContent = mainRes.customerKorName;
                document.getElementById('guest-contact').textContent = mainRes.contact || '정보 없음';
                document.getElementById('res-id').textContent = mainRes.reservationNumber || resId;
                
                const listContainer = document.getElementById('item-list');
                let allScheduleItems = [];
                let filteredTotalPrice = 0;

                reservations.forEach(res => {
                    let hasCurrentTripItem = false;
                    const isIndividualView = (itemIndex !== null);
                    const selectedItemName = isIndividualView && res.items ? res.items[itemIndex]?.name : "";

                    // --- 📅 가이드 텍스트 생성 로직 (상세 안내문 폼과 동기화) ---
                    function getGuidanceInternal(item, res) {
                        const name = item.name;
                        const details = item.details || "";
                        const isSending = name.includes('샌딩') || (item.details && item.details.includes('샌딩'));
                        const tourMonth = item.date ? parseInt(item.date.split('-')[1]) : new Date().getMonth() + 1;
                        const isDrySeason = tourMonth <= 5 || tourMonth >= 11;

                        if (name.includes('블랙펄')) {
                            const isLunch = details.includes('점심');
                            const meetingTime = isLunch ? '12:30' : '13:30';
                            const meetingPlace = isLunch ? '점보크랩' : (isDrySeason ? '8 Eight by the Beach' : '블라복 비치 목샤');
                            const mapLink = isLunch ? 'https://goo.gl/maps/d6tdF8tME3p16NtCA' : (isDrySeason ? 'https://maps.app.goo.gl/Wa491bdTXuKZ2BtB8' : 'https://www.google.co.kr/maps/place/Moksha+Cafe/@11.9676741,121.9274171,21z/data=!4m6!3m5!1s0x33a53d8366366ae1:0x48910864ce8dc2e6!8m2!3d11.967602!4d121.9274642!16s%2Fg%2F11sh1khm47');
                            
                            return `<b>미팅 시간 / 장소: ${meetingTime} / ${meetingPlace}</b><br>
                                    <a href="${mapLink}" target="_blank" style="color:#ff6a00; font-size:12px;">📍 구글맵 지도로 보기 (클릭)</a><br><br>
                                    ${isLunch ? '*점보크랩은 메인로드 졸리비 바로 건너편 입니다.' : `-트라이씨클 기사에게 “${meetingPlace}" 라고 꼭 말해주세요!`} <br><br>
                                    <b>★★ 주의 사항 및 준비물 ★★</b><br>
                                    - 미팅시간에서 10분이상 늦으시면 노쇼처리되며, 별도 연락없이 출항합니다.<br>
                                    - 준비물: 편한 물놀이 복장, 비치타올 1인 1장, 스노클 마스크(보유시), 보트맨팁 1인 100페소, 그외 개인 물품<br><br>
                                    🎉 <b>기념일 이벤트 안내</b><br>
                                    호핑투어 중 생일, 기념일 등이 있으시면 미리 카톡으로 알려주세요! 작게 축하 이벤트를 진행해 드립니다. (사전 요청 필수)`;
                        } 
                        else if (name.includes('말룸파티')) {
                            const meetingTime = isSending ? (res.sendingTime || '09:00') : '09:40';
                            const meetingPlace = isSending ? (res.activityPickupResort || res.pickupResort || '리조트 로비') : '보라카이션 사무실';
                            const mapInfo = !isSending ? `<br><a href="https://goo.gl/maps/pQkmCErHLjmQGRYM9" target="_blank" style="color:#ff6a00; font-size:12px;">📍 사무실 구글맵 보기 (클릭)</a>` : '';
                            
                            return `<b>미팅 시간 / 장소: ${meetingTime} / ${meetingPlace}</b>${mapInfo}<br><br>
                                    <b>★★ 주의 사항 및 준비물 ★★</b><br>
                                    - 미팅시간 10분 이상 지각 시 노쇼 처리됩니다.${isSending ? ' (미리 체크아웃 완료 필수)' : ''}<br>
                                    - 준비물: 편한 물놀이 복장, 비치타올, 매너팁 1인 100페소, 튜빙비 1인 350페소, 그외 개인 물품<br>
                                    ${isSending ? '- 추가비용: 칼리보 공항세 900페소, 라운지 샤워 이용 시 100페소' : ''}`;
                        }
                        else if (['에스파', '포세이돈', '아유르베다', '마리스', '힐롯', '루나', '보라스파', '헬리오스', '카바얀'].some(s => name.includes(s))) {
                            return `<b>미팅 시간 / 장소: ${item.time || ''} / ${res.activityPickupResort || '개별이동'}</b><br><br>
                                    <b>★ 준비물</b><br>
                                    - 편한 복장, 매너팁 1인 100페소, 그외 개인 물품`;
                        }
                        else if (name.includes('골프')) {
                            return `<b>미팅 시간 / 장소: ${item.time || '07:40'} / ${res.activityPickupResort || res.pickupResort || '리조트 로비'}</b><br><br>
                                    <b>★ 준비물 및 불포함사항</b><br>
                                    - 불포함: 클럽렌탈, 골프공/글로브, 개인음료, 캐디팁(100페소), 트라이씨클비용`;
                        }
                        else if (name.includes('랜드투어') || name.includes('아이랜드')) {
                            return `<b>미팅 시간 / 장소: ${item.time || '10:30'} / 보라카이션 사무실</b><br>
                                    <a href="https://goo.gl/maps/pQkmCErHLjmQGRYM9" target="_blank" style="color:#ff6a00; font-size:12px;">📍 사무실 구글맵 보기 (클릭)</a><br><br>
                                    <b>★ 준비물</b><br>
                                    - 편한 복장, 매너팁 1인 100페소, 그외 개인 물품`;
                        }
                        return `<b>미팅 시간 / 장소: ${item.time || ''} / ${res.activityPickupResort || res.pickupResort || '리조트 로비'}</b><br><br>
                                - 예약 시간에 맞춰 미팅 장소에서 대기해 주세요.`;
                    }
                    const isCurrentTrip = res.sendingDate && res.sendingDate >= todayStr; // 샌딩 안 지났으면 이번 여행
                    
                    // 1. 공항 픽업
                    if (res.pickupDate) {
                        const isRecentActivity = res.pickupDate >= activityLimitStr;
                        // 개별 상품 뷰일 때도 픽업 정보는 항상 노출
                        const shouldShowPickup = true;
                        
                        // (이번 여행 중이거나) OR (최근 15일 이내의 기록인 경우) 표시
                        if (shouldShowPickup && (isCurrentTrip || isRecentActivity)) {
                            const pickupFlight = (res.pickupFlight || "-").toUpperCase();
                            allScheduleItems.push({
                                date: res.pickupDate,
                                time: res.pickupTime || "00:00",
                                name: `✈️ 공항 픽업 (${pickupFlight})`,
                                isPickup: true,
                                content: `<b>미팅 장소: 칼리보 공항 밖 피켓 대기</b><br><br>
                                          - 보라카이션 피켓을 든 직원을 찾아주세요.<br>
                                          - 픽업 리조트: ${res.pickupResort || '-'}<br>
                                          ${res.exchangeAmount ? `- 💰 환전 요청: ${res.exchangeAmount}` : ''}`
                            });
                            hasCurrentTripItem = true;
                        }
                    }

                    // 2. 예약 상품 리스트
                    let rawItems = res.items || [];
                    rawItems.forEach((item, idx) => {
                        if (isIndividualView && parseInt(itemIndex) !== idx) return;
                        
                        // (이번 여행 중이거나) OR (해당 투어일로부터 15일이 안 지났으면) 표시
                        const isWithin15Days = item.date >= activityLimitStr;
                        if (isWithin15Days || isCurrentTrip) {
                            if (!item.name.includes('픽업샌딩')) {
                                allScheduleItems.push({
                                    date: item.date,
                                    time: item.time || "09:00",
                                    name: item.name,
                                    content: getGuidanceInternal(item, res)
                                });
                                hasCurrentTripItem = true;
                            }
                        }
                    });

                    // 3. 공항 샌딩
                    if (res.sendingDate) {
                        const isRecentActivity = res.sendingDate >= activityLimitStr;
                        // 개별 상품 뷰일 때도 샌딩 정보는 항상 노출
                        const shouldShowSending = true;
                        
                        if (shouldShowSending && (isCurrentTrip || isRecentActivity)) {
                            const sendingFlight = (res.sendingFlight || '-').toUpperCase();
                            const meetingTime = res.sendingTime || '08:30';
                            allScheduleItems.push({
                                date: res.sendingDate,
                                time: "23:59",
                                name: `✈️ 공항 샌딩 (${res.sendingFlight || '-'})`,
                                isSending: true,
                                content: `<b>미팅 시간 / 장소: ${meetingTime}(예정) / ${res.sendingResort || res.pickupResort || '리조트 로비'}</b><br><br>
                                          <div style="color: #d93025; font-weight: 700; background: #fff5f5; padding: 10px; border-radius: 8px; border: 1px solid #ffcfcf;">
                                            ★지정된 장소와 시간 전에 먼저 도착하셔서 대기해 주셔야 합니다.<br>
                                            리조트 체크아웃을 완료하고 샌딩 출발하는 시간입니다.<br>
                                            늦어서 별도로 이동을 해야 하는 경우 추가 요금이 발생합니다.
                                          </div><br>
                                          - 샌딩 리조트: ${res.sendingResort || res.pickupResort || '-'}`
                                });
                            hasCurrentTripItem = true;
                        }
                    }

                    if (hasCurrentTripItem) filteredTotalPrice += (res.totalPrice || 0);
                });

                document.getElementById('total-price').textContent = `₩ ${filteredTotalPrice.toLocaleString()}`;

                allScheduleItems.sort((a, b) => {
                    if (a.date !== b.date) return a.date.localeCompare(b.date);
                    return (a.time || "").localeCompare(b.time || "");
                });

                const mergedScheduleItems = [];
                allScheduleItems.forEach(item => {
                    if (item.isPickup || item.isSending) { mergedScheduleItems.push(item); return; }
                    const existing = mergedScheduleItems.find(m => m.date === item.date && (m.name === item.name || (m.name.includes('단품') && item.name.includes('단품'))));
                    if (existing) {
                        existing.content += `<br><br>--- 추가 항목 ---<br>${item.content}`;
                        if (!existing.name.includes('통합')) existing.name += ' (통합)';
                    } else { mergedScheduleItems.push(item); }
                });

                if (mergedScheduleItems.length === 0) listContainer.innerHTML = '<p style="text-align:center; padding:40px; color:#999;">진행 중이거나 최근 15일 이내의 일정이 없습니다.</p>';

                mergedScheduleItems.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'item-card';
                    card.innerHTML = `<div class="item-header"><div class="item-name">${item.name}</div><div class="item-status">확정됨</div></div>
                        <div class="item-details"><div class="detail-point" style="margin-bottom:10px;">📅 이용일: <b>${item.date}</b></div>
                        <div style="font-size:14px; color:#555; line-height:1.6; background:#f8f9fa; padding:15px; border-radius:12px; width:100%;">${item.content}</div></div>`;
                    listContainer.appendChild(card);
                });
            } else {
                document.body.innerHTML = '<div style="text-align:center; padding:100px;"><h1>데이터를 찾을 수 없습니다.</h1></div>';
            }
        } catch (err) {
            console.error(err);
            document.body.innerHTML = '<div style="text-align:center; padding:100px;"><h1>데이터 로드 중 오류가 발생했습니다.</h1></div>';
        }
    });
</script>

</body>
</html>
