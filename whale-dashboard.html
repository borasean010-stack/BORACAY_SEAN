<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>고래상어 리버타드 - 통합 대시보드</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root {
            --navy: #0f2a4a;
            --navy-soft: #2c4870;
            --sand: #c9a876;
            --orange: #ff6a00;
            --bg: #f6f3ec;
            --ink: #1c2b3a;
            --muted: #8a8f98;
            --line: #ececec;
            --radius: 18px;
            --shadow: 0 10px 30px rgba(15,42,74,0.06);
            --shadow-hover: 0 16px 40px rgba(15,42,74,0.12);
        }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Pretendard', sans-serif; background: var(--bg); color: var(--ink); }

        .header {
            background: #fff;
            padding: 22px 40px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 3px solid var(--navy);
            position: sticky; top: 0; z-index: 10;
        }
        .header h1 { margin: 0; font-size: 22px; color: var(--navy); font-weight: 900; letter-spacing: -0.3px; }
        .header .subtitle { margin: 2px 0 0; font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; }
        .header-link {
            color: var(--navy); font-size: 13px; font-weight: 800; text-decoration: none;
            background: #eef2f7; padding: 9px 16px; border-radius: 999px;
            display: inline-flex; align-items: center; gap: 6px; transition: 0.2s;
        }
        .header-link:hover { background: var(--navy); color: #fff; }
        .header-clock { color: var(--muted); font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }

        .container { max-width: 1200px; margin: 0 auto; padding: 36px 24px 80px; }

        .section-label {
            font-size: 12px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase;
            color: var(--sand); margin: 0 0 14px 4px;
        }

        .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; margin-bottom: 44px; }
        .stat-card {
            background: #fff; padding: 22px 24px; border-radius: var(--radius);
            box-shadow: var(--shadow); position: relative; overflow: hidden;
            border-top: 4px solid var(--stat-color, var(--navy));
        }
        .stat-card p { margin: 0 0 8px 0; color: var(--muted); font-size: 13px; font-weight: 700; }
        .stat-card h2 { margin: 0; font-size: 30px; font-weight: 900; letter-spacing: -0.5px; }

        .agency-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
        .agency-card {
            background: #fff; border-radius: var(--radius); padding: 24px;
            box-shadow: var(--shadow); position: relative;
            border-top: 5px solid var(--agency-color, var(--navy));
            cursor: pointer; transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .agency-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); }
        .agency-card .agency-head { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
        .agency-avatar {
            width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-weight: 900; font-size: 16px;
            background: var(--agency-color, var(--navy));
        }
        .agency-card h3 { margin: 0; font-size: 18px; font-weight: 900; color: var(--ink); }
        .agency-card .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 14px; }
        .agency-card .row strong { color: var(--muted); font-weight: 600; }
        .agency-card .remain-chip {
            margin-top: 16px; padding: 12px 16px; border-radius: 12px;
            background: #f6f3ec;
            background: color-mix(in srgb, var(--agency-color, var(--navy)) 8%, #fff);
            display: flex; justify-content: space-between; align-items: center;
        }
        .agency-card .remain-chip strong { color: var(--ink); font-weight: 800; font-size: 14px; }
        .agency-card .remain-chip span { font-weight: 900; font-size: 22px; color: var(--agency-color, var(--navy)); }

        .badge { padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 800; }
        .badge-active { background: #e6f7ed; color: #1e8a4c; }
        .badge-inactive { background: #fdeaea; color: #c62828; }

        .visit-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 4px; border-bottom: 1px solid var(--line); }
        .visit-row:last-child { border-bottom: none; }
        .visit-row .name { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 700; color: var(--ink); }
        .visit-row .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--agency-color, var(--navy)); flex-shrink: 0; }
        .visit-row .count { font-size: 16px; font-weight: 900; color: var(--agency-color, var(--navy)); }

        #loader { display: flex; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(246,243,236,0.92); z-index:9999; justify-content:center; align-items:center; flex-direction:column; }
        .spinner { border: 4px solid #e8e2d5; border-top: 4px solid var(--orange); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        @media (max-width: 900px) {
            .header { padding: 16px 20px; flex-wrap: wrap; gap: 10px; }
        }
        @media (max-width: 640px) {
            .container { padding: 24px 12px 60px; }
            .stat-grid { gap: 8px; }
            .stat-card { padding: 12px 8px; border-radius: 12px; text-align: center; }
            .stat-card p { font-size: 10px; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
            .stat-card h2 { font-size: 18px; }
        }
    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <p style="margin-top:20px; font-weight:800; color:var(--navy);">데이터를 불러오는 중입니다...</p>
    </div>

    <div class="header">
        <div style="display:flex; align-items:center; gap:14px;">
            <img src="libertad.png" alt="Libertad Whale Shark" style="width:44px; height:44px; object-fit:contain;">
            <div>
                <h1>고래상어 리버타드 통합 대시보드</h1>
                <p class="subtitle">Whale Shark · Libertad Partner Console</p>
            </div>
        </div>
        <div style="display:flex; align-items:center; gap:14px;">
            <a href="whale-counter.html" class="header-link">QR 카운터로 이동</a>
            <div class="header-clock" id="current-time"></div>
        </div>
    </div>

    <div class="container">
        <p class="section-label">오늘의 현황</p>
        <div class="stat-grid">
            <div class="stat-card" style="--stat-color:#0f2a4a;">
                <p id="lbl-total-bought">월 구매 티켓</p>
                <h2 id="total-bought" style="color:#0f2a4a;">0</h2>
            </div>
            <div class="stat-card" style="--stat-color:#ff2d55;">
                <p id="lbl-total-used">월 사용 티켓</p>
                <h2 id="total-used" style="color:#ff2d55;">0</h2>
            </div>
            <div class="stat-card" style="--stat-color:#007aff;">
                <p>총 잔여 티켓</p>
                <h2 id="total-remain" style="color:#007aff;">0</h2>
            </div>
            <div class="stat-card" style="--stat-color:#34c759;">
                <p>오늘 현장 방문 (리버타드)</p>
                <h2 id="today-count" style="color:#34c759;">0</h2>
            </div>
        </div>

        <p class="section-label" style="margin-top:4px;">정산</p>
        <div class="stat-grid" style="grid-template-columns: 1fr 1fr; margin-bottom:44px;">
            <div class="stat-card" style="--stat-color:#ff6a00;">
                <p id="today-settle-label">오늘 정산</p>
                <h2 id="today-settle-amount" style="color:#ff6a00;">₱0</h2>
            </div>
            <div class="stat-card" style="--stat-color:var(--navy); cursor:pointer;" onclick="openSettlementModal()">
                <p>정산 내역</p>
                <h2 style="color:var(--navy); font-size:18px;">날짜·판매처별 보기 →</h2>
            </div>
        </div>

        <!-- 정산 기록 모달 -->
        <div id="ws-settlement-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:9999; justify-content:center; align-items:center;">
            <div style="background:#fff; border-radius:20px; width:700px; max-width:95vw; max-height:85vh; display:flex; flex-direction:column; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,0.2);">
                <div style="padding:24px 28px; border-bottom:1px solid #eee; display:flex; justify-content:space-between; align-items:center;">
                    <h2 style="margin:0; font-size:20px; font-weight:900;">정산 기록</h2>
                    <button onclick="closeSettlementModal()" style="background:none; border:none; font-size:24px; cursor:pointer; color:#888;">&times;</button>
                </div>
                <div style="padding:20px 28px; overflow-y:auto; flex:1;">
                    <div id="ws-settlement-list"><div style="text-align:center; color:#aaa; padding:40px;">불러오는 중...</div></div>
                </div>
            </div>
        </div>

        <div style="background:#fff; border-radius:var(--radius); box-shadow:var(--shadow); padding:22px 24px; margin-bottom:44px;">
            <p style="margin:0 0 16px; font-size:14px; font-weight:800; color:var(--ink);">오늘 방문 판매처별 내역</p>
            <div id="today-visit-breakdown">
                <div style="text-align:center; color:#aaa; padding:20px; font-size:13px;">불러오는 중...</div>
            </div>
        </div>

        <p class="section-label" style="margin-top:4px;">등록된 판매처</p>
        <h2 style="margin:0 0 20px; font-size:22px; font-weight:900; color:var(--navy);">판매처 현황</h2>
        <div class="agency-grid" id="agency-grid">
            <!-- 업체 카드가 여기에 렌더링 됩니다. -->
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, query, where, getDocs, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDkDjmGKQDF-0Vu2S_qtI6W5Hf2-j4tKcM",
            authDomain: "boracaysean-69b4a.firebaseapp.com",
            projectId: "boracaysean-69b4a",
            storageBucket: "boracaysean-69b4a.firebasestorage.app",
            messagingSenderId: "806585874771",
            appId: "1:806585874771:web:64a094d241730ca38109a6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let dashboardAgencies = [];

        // 시계 업데이트
        setInterval(() => {
            const now = new Date();
            document.getElementById('current-time').innerText = now.toLocaleString('ko-KR');
        }, 1000);

        
        window.showDailyUsage = async function(agencyId, agencyName) {
            Swal.fire({
                title: '데이터를 불러오는 중...',
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading(); }
            });
            try {
                const q = query(
                    collection(db, "whale_transactions"),
                    where("agencyId", "==", agencyId),
                    where("type", "==", "USE")
                );
                const querySnapshot = await getDocs(q);
                
                const dailyStats = {};
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const date = (data.createdAt || '').substring(0, 10);
                    if (date) {
                        dailyStats[date] = (dailyStats[date] || 0) + (data.amount || 0);
                    }
                });

                const sortedDates = Object.keys(dailyStats).sort((a, b) => b.localeCompare(a));
                
                let html = '<div style="max-height: 300px; overflow-y: auto; text-align: left;">';
                if (sortedDates.length === 0) {
                    html += '<p style="text-align:center; color:#888; margin-top:20px;">사용 내역이 없습니다.</p>';
                } else {
                    html += '<table style="width:100%; border-collapse: collapse;">';
                    html += '<thead><tr><th style="padding:10px; border-bottom:2px solid #ddd; text-align:left;">날짜</th><th style="padding:10px; border-bottom:2px solid #ddd; text-align:right;">사용량</th></tr></thead><tbody>';
                    sortedDates.forEach(date => {
                        html += `<tr><td style="padding:10px; border-bottom:1px solid #eee;">${date}</td><td style="padding:10px; border-bottom:1px solid #eee; text-align:right; font-weight:bold; color:#ff2d55;">${dailyStats[date]}장</td></tr>`;
                    });
                    html += '</tbody></table>';
                }
                html += '</div>';

                Swal.fire({
                    title: `${agencyName} 일별 사용량`,
                    html: html,
                    confirmButtonText: '닫기'
                });
            } catch (e) {
                console.error(e);
                Swal.fire('오류', '데이터를 불러오는데 실패했습니다.', 'error');
            }
        };

        // 데이터 실시간 연동

        const agencyRef = collection(db, "whale_agencies");
        onSnapshot(agencyRef, (snapshot) => {
            const agencies = [];
            let totalMonthlyBought = 0;
            let totalMonthlyUsed = 0;
            let totalRemain = 0;

            const today = new Date();
            const currentMonthStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}`;
            const currentMonthNum = today.getMonth() + 1;

            snapshot.forEach(docSnap => {
                const data = docSnap.data();
                data.id = docSnap.id;
                agencies.push(data);
                
                // 과거 테스트 데이터 화면 보정 (업데이트는 admin에서 하므로 여기선 값만 보정)
                if (data.monthlyBought === undefined || data.monthlyUsed === undefined) {
                    data.monthlyBought = data.totalBought || 0;
                    data.monthlyUsed = data.totalUsed || 0;
                    data.currentMonth = currentMonthStr;
                }

                // 테스트 오류 수치 강제 보정
                if ((data.monthlyBought || 0) < (data.monthlyUsed || 0)) {
                    data.monthlyBought = (data.monthlyUsed || 0) + (data.remainCount || 0);
                    data.totalBought = data.monthlyBought;
                }

                if (data.currentMonth === currentMonthStr) {
                    totalMonthlyBought += (data.monthlyBought || 0);
                    totalMonthlyUsed += (data.monthlyUsed || 0);
                }
                totalRemain += (data.remainCount || 0);
            });

            // 정렬: 생성일 역순
            agencies.sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
            dashboardAgencies = agencies;
            if (window.loadTodayBreakdown) window.loadTodayBreakdown();

            // 재무 카드 업데이트
            const finTotal = document.getElementById('ws-fin-total');
            const finBenefit = document.getElementById('ws-fin-benefit');
            const finCost = document.getElementById('ws-fin-cost');
            const lblFinTotal = document.getElementById('lbl-fin-total');
            const lblFinBenefit = document.getElementById('lbl-fin-benefit');
            const lblFinCost = document.getElementById('lbl-fin-cost');
            if (finTotal) finTotal.innerText = (totalMonthlyBought * 1920).toLocaleString() + ' ₱';
            if (finBenefit) finBenefit.innerText = (totalMonthlyBought * 250).toLocaleString() + ' ₱';
            if (finCost) finCost.innerText = (totalMonthlyBought * 1670).toLocaleString() + ' ₱';
            if (lblFinTotal) lblFinTotal.innerHTML = `${currentMonthNum}월 구매티켓 총금액`;
            if (lblFinBenefit) lblFinBenefit.innerHTML = `${currentMonthNum}월 베네핏 금액`;
            if (lblFinCost) lblFinCost.innerHTML = `${currentMonthNum}월 티켓비용`;

            // 상단 통계 업데이트
            document.getElementById('lbl-total-bought').innerText = `${currentMonthNum}월 구매티켓`;
            document.getElementById('lbl-total-used').innerText = `${currentMonthNum}월 사용티켓`;
            document.getElementById('total-bought').innerText = totalMonthlyBought.toLocaleString();
            document.getElementById('total-used').innerText = totalMonthlyUsed.toLocaleString();
            document.getElementById('total-remain').innerText = totalRemain.toLocaleString();

            // 카드 렌더링
            const grid = document.getElementById('agency-grid');
            if (agencies.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1 / -1; text-align:center; padding: 40px; color:#888;">등록된 판매처가 없습니다.</div>';
            } else {
                grid.innerHTML = agencies.map(a => {
                    const isActive = a.status !== 'INACTIVE';
                    const color = a.agencyColor || '#007aff';
                    const mBought = a.currentMonth === currentMonthStr ? (a.monthlyBought || 0) : 0;
                    const mUsed = a.currentMonth === currentMonthStr ? (a.monthlyUsed || 0) : 0;
                    const initial = (a.name || '?').trim().charAt(0);

                    return `
                        <div class="agency-card" style="--agency-color:${color};" onclick="showDailyUsage('${a.id}', '${a.name}')">
                            <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:2px;">
                                <div class="agency-head" style="border-bottom:none; margin-bottom:0; padding-bottom:0;">
                                    <div class="agency-avatar">${initial}</div>
                                    <h3>${a.name}</h3>
                                </div>
                                <span class="badge ${isActive ? 'badge-active' : 'badge-inactive'}">${isActive ? '활성' : '정지됨'}</span>
                            </div>
                            <div style="height:16px; border-bottom:1px solid var(--line); margin-bottom:16px;"></div>
                            <div class="row">
                                <strong>${currentMonthNum}월 구매티켓</strong>
                                <span>${mBought.toLocaleString()}</span>
                            </div>
                            <div class="row">
                                <strong>${currentMonthNum}월 사용티켓</strong>
                                <span>${mUsed.toLocaleString()}</span>
                            </div>
                            <div class="remain-chip">
                                <strong>총 잔여티켓</strong>
                                <span>${(a.remainCount || 0).toLocaleString()}</span>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            document.getElementById('loader').style.display = 'none';
        }, (error) => {
            console.error("데이터 로드 에러:", error);
            Swal.fire('오류', '데이터를 불러오는 중 문제가 발생했습니다.', 'error');
        });

        // 오늘 방문자 통계 실시간 연동
        const todayStr = `${new Date().getFullYear()}-${String(new Date().getMonth()+1).padStart(2,'0')}-${String(new Date().getDate()).padStart(2,'0')}`;
        onSnapshot(doc(db, "whale_daily_counts", todayStr), (docSnap) => {
            const count = docSnap.exists() ? (docSnap.data().count || 0) : 0;
            document.getElementById('today-count').innerText = count.toLocaleString();
        });


        // 오늘 판매처별 방문/사용 집계 + 오늘 정산 금액
        window.loadTodayBreakdown = async function() {
            const phOffset = 8 * 60 * 60 * 1000;
            const phToday = new Date(new Date().getTime() + phOffset);
            const phTodayStr = `${phToday.getUTCFullYear()}-${String(phToday.getUTCMonth()+1).padStart(2,'0')}-${String(phToday.getUTCDate()).padStart(2,'0')}`;
            const todayLabel = `${phToday.getUTCMonth() + 1}월 ${phToday.getUTCDate()}일`;

            const settleAmountEl = document.getElementById('today-settle-amount');
            const settleLabelEl = document.getElementById('today-settle-label');
            const breakdownEl = document.getElementById('today-visit-breakdown');

            try {
                const txQ = query(collection(db, 'whale_transactions'), where('createdAt', '>=', phTodayStr + 'T00:00:00'), where('createdAt', '<=', phTodayStr + 'T23:59:59'));
                const snap = await getDocs(txQ);
                const byAgency = {};
                let totalToday = 0;
                snap.forEach(d => {
                    const data = d.data();
                    if (data.type !== 'USE') return;
                    const amt = data.amount || 0;
                    totalToday += amt;
                    byAgency[data.agencyId] = (byAgency[data.agencyId] || 0) + amt;
                });

                if (settleAmountEl) settleAmountEl.innerText = `₱${(totalToday * 1670).toLocaleString()}`;
                if (settleLabelEl) settleLabelEl.innerText = `오늘(${todayLabel}) 정산 · ${totalToday}장 × ₱1,670`;

                if (breakdownEl) {
                    const agencyMap = {};
                    dashboardAgencies.forEach(a => { agencyMap[a.id] = a; });
                    const entries = Object.entries(byAgency).sort((a, b) => b[1] - a[1]);

                    if (entries.length === 0) {
                        breakdownEl.innerHTML = '<div style="text-align:center; color:#aaa; padding:20px; font-size:13px;">오늘 방문 기록이 없습니다.</div>';
                    } else {
                        breakdownEl.innerHTML = entries.map(([agencyId, count]) => {
                            const agency = agencyMap[agencyId];
                            const name = agency ? agency.name : '알 수 없는 업체';
                            const color = agency ? (agency.agencyColor || '#007aff') : '#999';
                            return `
                                <div class="visit-row" style="--agency-color:${color};">
                                    <div class="name"><span class="dot"></span>${name}</div>
                                    <div class="count">${count.toLocaleString()}명</div>
                                </div>
                            `;
                        }).join('');
                    }
                }
            } catch(e) { console.error('오늘 방문/정산 집계 로드 실패', e); }
        };
        loadTodayBreakdown();

        window.openSettlementModal = async function() {
            document.getElementById('ws-settlement-modal').style.display = 'flex';
            const listEl = document.getElementById('ws-settlement-list');
            listEl.innerHTML = '<div style="text-align:center; color:#aaa; padding:40px;">불러오는 중...</div>';

            try {
                const txSnap = await getDocs(collection(db, 'whale_transactions'));
                const dailyMap = {};
                txSnap.forEach(d => {
                    const data = d.data();
                    if (data.type !== 'USE') return;
                    const date = (data.createdAt || '').substring(0, 10);
                    if (!date) return;
                    if (!dailyMap[date]) dailyMap[date] = {};
                    dailyMap[date][data.agencyId] = (dailyMap[date][data.agencyId] || 0) + (data.amount || 0);
                });

                const settlementSnap = await getDocs(collection(db, 'whale_settlements'));
                const paidMap = {};
                settlementSnap.forEach(d => { paidMap[d.id] = d.data(); });

                const sortedDates = Object.keys(dailyMap).sort((a, b) => b.localeCompare(a));

                if (sortedDates.length === 0) {
                    listEl.innerHTML = '<div style="text-align:center; color:#aaa; padding:40px;">정산 내역이 없습니다.</div>';
                    return;
                }

                const agencyMap = {};
                dashboardAgencies.forEach(a => { agencyMap[a.id] = a.name; });

                let html = '';
                sortedDates.forEach(date => {
                    const agcs = dailyMap[date];
                    const totalUsed = Object.values(agcs).reduce((a, b) => a + b, 0);
                    const totalAmount = totalUsed * 1670;
                    html += `<div style="background:#f4f7f6; padding:12px 16px; border-radius:10px; margin-bottom:8px; font-weight:800; color:#333;">
                        ${date} &nbsp; <span style="color:#007aff;">${totalUsed}장</span> &nbsp; <span style="color:#34c759; font-size:16px;">= ${totalAmount.toLocaleString()} ₱</span>
                    </div>`;
                    Object.entries(agcs).forEach(([agencyId, usedCount]) => {
                        const agencyName = agencyMap[agencyId] || '알 수 없는 업체';
                        const amount = usedCount * 1670;
                        const key = `${date}_${agencyId}`;
                        const isPaid = paidMap[key]?.isPaid || false;
                        const paidAt = paidMap[key]?.paidAt || '';
                        html += `<div style="display:flex; align-items:center; padding:12px 16px; border:1px solid #eee; border-radius:10px; margin-bottom:6px; background:${isPaid ? '#f0fff4' : '#fff'};">
                            <div style="flex:1;">
                                <div style="font-weight:700; color:#111;">${agencyName}</div>
                                <div style="font-size:12px; color:#888; margin-top:2px;">${usedCount}장 × 1,670 = <strong style="color:#007aff;">${amount.toLocaleString()} ₱</strong>${isPaid ? ` ${paidAt ? paidAt.substring(0,10) + ' 정산완료' : '정산완료'}` : ''}</div>
                            </div>
                            <div style="font-size:13px; font-weight:800; color:${isPaid ? '#34c759' : '#ff9500'};">${isPaid ? '완료' : '미정산'}</div>
                        </div>`;
                    });
                    html += '<div style="margin-bottom:16px;"></div>';
                });
                listEl.innerHTML = html;
            } catch(e) {
                console.error(e);
                listEl.innerHTML = '<div style="text-align:center; color:#ff2d55; padding:40px;">데이터 로드 실패</div>';
            }
        };

        window.closeSettlementModal = function() {
            document.getElementById('ws-settlement-modal').style.display = 'none';
        };

    </script>
</body>
</html>
