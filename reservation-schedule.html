<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>예약 확인서 - Boracay Sean</title>
    <meta property="og:title" content="예약 확인서 - Boracay Sean">
    <meta property="og:description" content="가장 완벽한 보라카이 여행의 시작, 보라카이션과 함께하세요.">
    <meta property="og:image" content="https://www.boracaysean.com/logo.png">
    <meta property="og:type" content="website">
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; background: #f0f2f5; margin: 0; padding: 40px 20px; color: #333; line-height: 1.6; }
        .voucher-container { max-width: 800px; margin: 0 auto; background: #fff; border-radius: 30px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.1); }
        .voucher-header { background: #111; color: #fff; padding: 40px; text-align: center; }
        .voucher-header img { width: 80px; margin-bottom: 15px; }
        .voucher-header h1 { margin: 0; font-size: 28px; font-weight: 900; letter-spacing: 2px; }
        .voucher-header p { margin: 10px 0 0 0; opacity: 0.6; font-size: 14px; }
        
        .voucher-body { padding: 40px; }
        .section-title { font-size: 18px; font-weight: 800; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; color: #00c73c; }
        .section-title::before { content: ''; width: 4px; height: 18px; background: #00c73c; border-radius: 2px; }
        
        .info-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; background: #f9fafb; padding: 25px; border-radius: 20px; margin-bottom: 40px; }
        .info-item label { display: block; font-size: 12px; color: #888; margin-bottom: 5px; font-weight: 600; }
        .info-item span { display: block; font-size: 16px; font-weight: 700; color: #111; }
        
        .item-card { border: 1px solid #eee; border-radius: 20px; padding: 25px; margin-bottom: 20px; transition: 0.3s; }
        .item-card:hover { border-color: #00c73c; box-shadow: 0 10px 30px rgba(0,199,60,0.05); }
        .item-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; }
        .item-name { font-size: 18px; font-weight: 800; color: #111; }
        .item-status { background: #e6f9ed; color: #00c73c; font-size: 12px; font-weight: 800; padding: 6px 12px; border-radius: 50px; }
        
        .item-details { display: flex; flex-wrap: wrap; gap: 20px; }
        .detail-point { font-size: 14px; color: #666; display: flex; align-items: center; gap: 8px; }
        .detail-point b { color: #111; }

        .notice-box { background: #fff8e6; border-radius: 20px; padding: 25px; border: 1px solid #ffeeba; margin-top: 40px; }
        .notice-box h4 { margin: 0 0 10px 0; font-size: 15px; font-weight: 800; color: #856404; }
        .notice-box ul { margin: 0; padding-left: 20px; font-size: 13px; color: #856404; }
        
        .print-btn { position: fixed; bottom: 30px; right: 30px; background: #00c73c; color: #fff; border: none; padding: 15px 30px; border-radius: 50px; font-weight: 800; cursor: pointer; box-shadow: 0 10px 30px rgba(0,199,60,0.3); transition: 0.3s; }
        .print-btn:hover { transform: translateY(-5px); background: #00b035; }

        @media print { .print-btn { display: none; } body { padding: 0; background: #fff; } .voucher-container { box-shadow: none; border-radius: 0; } }
    </style>
</head>
<body>

<div class="voucher-container">
    <div class="voucher-header">
        <img src="logo.png" alt="Logo">
        <h1>BORACAY_SEAN</h1>
        <p>GUEST RESERVATION VOUCHER</p>
    </div>

    <div class="voucher-body">
        <div class="section-title">예약자 정보</div>
        <div class="info-grid">
            <div class="info-item"><label>대표자명</label><span id="guest-name">-</span></div>
            <div class="info-item"><label>연락처</label><span id="guest-contact">-</span></div>
            <div class="info-item"><label>예약번호</label><span id="res-id">-</span></div>
            <div class="info-item"><label>결제금액</label><span id="total-price">-</span></div>
        </div>

        <div class="section-title">투어 및 액티비티 일정</div>
        <div id="item-list">
            <!-- JS Render -->
        </div>

        <div class="notice-box">
            <h4>안내 및 유의사항</h4>
            <ul>
                <li>모든 일정은 현지 기상 상황 및 업체 사정에 의해 다소 변경될 수 있습니다.</li>
                <li>픽업 시간 10분 전까지 약속 장소에서 대기해 주시기 바랍니다.</li>
                <li>문의 사항은 보라카이션 카카오톡 채널을 이용해 주세요.</li>
            </ul>
        </div>
    </div>
</div>

<button class="print-btn" onclick="window.print()">인쇄하기</button>

<script>
    document.addEventListener('DOMContentLoaded', async () => {
        const urlParams = new URLSearchParams(window.location.search);
        const resId = urlParams.get('id');
        const itemIndex = urlParams.get('itemIndex'); 
        
        if (!resId) {
            alert('예약 정보를 찾을 수 없습니다.');
            return;
        }

        const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js");
        const { getFirestore, doc, getDoc } = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js");

        const firebaseConfig = {
            apiKey: "AIzaSyDkDjmGKQDF-0Vu2S_qtI6W5Hf2-j4tKcM",
            authDomain: "boracaysean-69b4a.firebaseapp.com",
            projectId: "boracaysean-69b4a",
            storageBucket: "boracaysean-69b4a.firebasestorage.app",
            messagingSenderId: "806585874771",
            appId: "1:806585874771:web:64a094d241730ca38109a6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        try {
            const docSnap = await getDoc(doc(db, "reservations", resId));
            if (docSnap.exists()) {
                const res = docSnap.data();
                document.getElementById('guest-name').textContent = res.customerKorName;
                document.getElementById('guest-contact').textContent = res.contact || '정보 없음';
                document.getElementById('res-id').textContent = res.reservationNumber || resId;
                document.getElementById('total-price').textContent = `₩ ${(res.totalPrice || 0).toLocaleString()}`;

                const listContainer = document.getElementById('item-list');
                let allScheduleItems = [];

                // 1. 공항 픽업/샌딩 정보 추가
                if (res.pickupDate || res.pickupFlight || res.sendingDate || res.sendingFlight) {
                    if (itemIndex === null || (res.items && res.items[itemIndex] && res.items[itemIndex].name.includes('픽업샌딩'))) {
                        if (res.pickupDate) {
                            allScheduleItems.push({
                                date: res.pickupDate,
                                time: "공항도착",
                                name: "보라카이션 공항 픽업",
                                details: `항공편: ${res.pickupFlight || '-'}<br>이용 리조트: ${res.pickupResort || '-'}`
                            });
                        }
                        if (res.sendingDate) {
                            allScheduleItems.push({
                                date: res.sendingDate,
                                time: "리조트미팅",
                                name: "보라카이션 공항 샌딩",
                                details: `항공편: ${res.sendingFlight || '-'}<br>픽업 리조트: ${res.sendingResort || '-'}`
                            });
                        }
                    }
                }

                // 2. 예약 상품 리스트 추가 (필터링 적용)
                let rawItems = res.items || [];
                if (itemIndex !== null && rawItems[itemIndex]) {
                    // 개별 보기일 때 픽업샌딩 중복 방지 (위에서 추가했으므로)
                    if (!rawItems[itemIndex].name.includes('픽업샌딩')) {
                        allScheduleItems.push(rawItems[itemIndex]);
                    }
                } else if (itemIndex === null) {
                    rawItems.forEach(item => {
                        if (!item.name.includes('픽업샌딩')) {
                            allScheduleItems.push(item);
                        }
                    });
                }

                // 3. 날짜 및 시간순 정렬
                allScheduleItems.sort((a, b) => {
                    if (a.date !== b.date) return a.date.localeCompare(b.date);
                    return (a.time || "").localeCompare(b.time || "");
                });

                if (allScheduleItems.length === 0) {
                    listContainer.innerHTML = '<p style="text-align:center; padding:40px; color:#999;">등록된 상세 일정이 없습니다.</p>';
                }

                allScheduleItems.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'item-card';
                    card.innerHTML = `
                        <div class="item-header">
                            <div class="item-name">${item.name}</div>
                            <div class="item-status">확정됨</div>
                        </div>
                        <div class="item-details">
                            <div class="detail-point">날짜: <b>${item.date}</b></div>
                            <div class="detail-point">시간: <b>${item.time || '종일'}</b></div>
                            ${item.count ? `<div class="detail-point">인원: <b>${item.count}명</b></div>` : ''}
                            ${item.details ? `<div class="detail-point" style="width:100%; margin-top:10px; border-top:1px dashed #eee; padding-top:10px; line-height:1.6;">${item.details}</div>` : ''}
                        </div>
                    `;
                    listContainer.appendChild(card);
                });
            } else {
                document.body.innerHTML = '<div style="text-align:center; padding:100px;"><h1>데이터를 찾을 수 없습니다.</h1></div>';
            }
        } catch (err) {
            console.error(err);
            document.body.innerHTML = '<div style="text-align:center; padding:100px;"><h1>데이터 로드 중 오류가 발생했습니다.</h1></div>';
        }
    });
</script>

</body>
</html>
