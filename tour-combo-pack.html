<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>보라카이션 투어 콤보팩 - 인기 투어 묶음 할인</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <style>
        .tour-detail-container { max-width: 1100px; margin: 120px auto 50px; display: grid; grid-template-columns: 1fr 360px; gap: 40px; padding: 0 20px; }
        .tour-content { background: white; padding: 40px; border-radius: 28px; box-shadow: 0 15px 40px rgba(0,0,0,0.03); }
        .reservation-box { background: white; border-radius: 20px; padding: 15px; box-shadow: 0 20px 50px rgba(0,0,0,0.08); position: sticky; top: 80px; height: fit-content; border: 1px solid #f0f0f0; }
        .combo-option { border: 2px solid #eee; padding: 15px; border-radius: 12px; margin-bottom: 10px; cursor: pointer; }
        .combo-option.selected { border-color: #ff6a00; background: #fffaf5; }
    </style>
</head>
<body>
<div class="tour-detail-container">
    <div class="tour-content">
        <h1>보라카이션 투어 콤보팩</h1>
        <img src="tourpack.png" style="width:100%; border-radius:20px; margin-bottom:20px;">
        <div class="section-title">콤보팩 옵션 선택</div>
        <div id="combo-options">
            <div class="combo-option" onclick="selectCombo('콤보팩 A', 220000)"><h4>콤보팩 A</h4><p>말룸파티 + 고래상어</p></div>
            <div class="combo-option" onclick="selectCombo('콤보팩 B', 270000)"><h4>콤보팩 B</h4><p>호핑 + 고래상어 + 말룸파티</p></div>
        </div>
    </div>
    <div class="reservation-box">
        <div id="total-price" style="font-size:24px; font-weight:900; color:#ff6a00; margin-bottom:20px;">₩ 220,000</div>
        <button class="btn-buy" onclick="handleBuy()">구매하기</button>
    </div>
</div>
<script>
    let selectedCombo = { name: '콤보팩 A', price: 220000 };
    function selectCombo(name, price) {
        selectedCombo = { name, price };
        document.querySelectorAll('.combo-option').forEach(el => el.classList.remove('selected'));
        event.currentTarget.classList.add('selected');
        document.getElementById('total-price').innerText = '₩ ' + price.toLocaleString();
    }
    function handleBuy() {
        sessionStorage.setItem('directBuyItem', JSON.stringify({ name: '보라카이션 콤보팩 - ' + selectedCombo.name, price: selectedCombo.price, count: 1 }));
        window.open('booking-form.html', '_blank');
    }
</script>
</body>
</html>
