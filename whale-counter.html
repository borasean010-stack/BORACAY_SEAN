<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Whale Shark Libertad Counter</title>

    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <style>
        :root {
            --navy: #0f2a4a;
            --navy-soft: #2c4870;
            --sand: #c9a876;
            --orange: #ff6a00;
            --bg: #f6f3ec;
            --ink: #1c2b3a;
            --muted: #8a8f98;
        }
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; background: var(--bg); color: var(--ink); }
        .container { max-width: 500px; margin: 0 auto; min-height: 100vh; background: var(--bg); display: flex; flex-direction: column; }

        .header { background: var(--navy); padding: 24px 20px 34px; text-align: center; color: #fff; position: relative; overflow: hidden; }
        .header h1 { margin: 0; font-size: 21px; font-weight: 900; position: relative; z-index: 1; }
        .header p { margin: 4px 0 0 0; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; color: var(--sand); font-weight: 700; position: relative; z-index: 1; }
        .header .dashboard-link { position: absolute; top: 16px; right: 16px; z-index: 1; display: flex; align-items: center; gap: 4px; padding: 8px 14px; background: rgba(255,255,255,0.12); border-radius: 20px; color: #fff; text-decoration: none; font-size: 13px; font-weight: 700; }
        .header .dashboard-link:active { background: rgba(255,255,255,0.25); }
        .header-wave { position: absolute; left: 0; right: 0; bottom: -1px; line-height: 0; }
        .header-wave svg { width: 100%; height: 24px; display: block; }

        .content { padding: 28px 20px 30px; flex: 1; display: flex; flex-direction: column; align-items: center; }

        .card { width: 100%; background: #fff; border-radius: 16px; padding: 24px; box-shadow: 0 8px 24px rgba(15,42,74,0.06); box-sizing: border-box; text-align: center; margin-bottom: 18px; border: 1px solid #eee; }

        .stat-label { color: var(--muted); font-size: 13px; font-weight: 700; margin-bottom: 10px; }
        .stat-value { font-size: 48px; font-weight: 900; color: var(--navy); line-height: 1; }

        .input-group { margin: 20px 0; width: 100%; text-align: left; }
        .input-group label { display: block; font-weight: bold; margin-bottom: 8px; color: #555; }
        .input-group input { width: 100%; padding: 15px; font-size: 20px; text-align: center; border: 2px solid #eee; border-radius: 12px; box-sizing: border-box; font-weight: bold; transition: 0.2s; }
        .input-group input:focus { border-color: var(--orange); outline: none; }

        .btn-primary { width: 100%; padding: 16px; font-size: 18px; font-weight: bold; background: var(--orange); color: #fff; border: none; border-radius: 12px; cursor: pointer; transition: 0.2s; box-shadow: 0 6px 16px rgba(255,106,0,0.25); }
        .btn-primary:active { transform: scale(0.98); background: #e35f00; }
        .btn-primary:disabled { background: #ccc; box-shadow: none; cursor: not-allowed; }

        .btn-secondary { padding: 12px 20px; font-size: 14px; font-weight: bold; background: #fff; color: var(--navy); border: 1px solid #ddd; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 8px; margin: 0 auto; }

        .scan-icon-badge { width: 96px; height: 96px; border-radius: 50%; background: #fff; border: 2px dashed var(--sand); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; }

        #reader { width: 100%; max-width: 400px; margin: 0 auto; display: none; border-radius: 16px; overflow: hidden; }

        .overlay-loader { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(246,243,236,0.92); z-index: 999; display: flex; flex-direction: column; justify-content: center; align-items: center; display: none; }
        .spinner { border: 4px solid #e8e2d5; width: 40px; height: 40px; border-radius: 50%; border-left-color: var(--orange); animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="overlay-loader" id="loader">
    <div class="spinner"></div>
    <div style="font-weight:bold; color:#555;">Processing...</div>
</div>

<div class="container">
    <div class="header">
        <a class="dashboard-link" href="whale-dashboard.html">
            <span class="material-icons" style="font-size:16px;">dashboard</span> Dashboard
        </a>
        <img src="libertad.png" alt="Libertad Whale Shark" style="width:56px; height:56px; object-fit:contain; margin-bottom:8px; position:relative; z-index:1;">
        <h1>Whale Shark Field Counter</h1>
        <p>Libertad Only</p>
        <div class="header-wave">
            <svg viewBox="0 0 500 24" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M0 12 C 60 24, 120 0, 180 12 S 300 24, 360 12 S 480 0, 500 10 V24 H0 Z" fill="#f6f3ec"></path>
            </svg>
        </div>
    </div>

    <!-- Scan screen -->
    <div class="content" id="view-scan" style="display: none; justify-content: center;">
        <div style="text-align:center; width:100%;">
            <div class="scan-icon-badge">
                <span class="material-icons" style="font-size:44px; color:var(--orange);">qr_code_scanner</span>
            </div>
            <h2 style="margin-top:0; color:var(--navy);">Scan the QR Code</h2>
            <p style="color:var(--muted); font-size:14px; margin-bottom:30px;">Scan the visitor's QR code<br>to check remaining tickets.</p>
            <div id="reader"></div>
            <button class="btn-primary" onclick="startScanner()" id="btn-start-scan" style="margin-bottom:15px;">Scan with Camera</button>
        </div>
    </div>

    <!-- Counter (deduction) screen -->
    <div class="content" id="view-counter" style="display: none;">
        <div class="card">
            <div class="stat-label">Available Tickets</div>
            <div class="stat-value" id="display-remain">0</div>
        </div>

        <div class="card" style="border: 2px solid var(--orange);">
            <div class="input-group" style="margin: 0;">
                <label style="text-align:center; color:var(--orange); font-size:16px;">Enter Number of Visitors</label>
                <input type="number" id="input-count" placeholder="0" min="1" pattern="[0-9]*" inputmode="numeric">
            </div>
        </div>

        <div class="card">
            <div class="input-group" style="margin: 0;">
                <label style="text-align:center; font-size:14px;">Guide Name (QR Remark)</label>
                <input type="text" id="input-remark" placeholder="e.g. Guide John" style="font-size:15px; font-weight:600; text-align:left;">
            </div>
        </div>

        <button class="btn-primary" id="btn-deduct">Confirm Ticket Deduction</button>

        <div style="margin-top:30px;">
            <button class="btn-secondary" onclick="resetToScan()"><span class="material-icons">refresh</span> Scan Again</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs, doc, runTransaction } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDkDjmGKQDF-0Vu2S_qtI6W5Hf2-j4tKcM",
        authDomain: "boracaysean-69b4a.firebaseapp.com",
        projectId: "boracaysean-69b4a",
        storageBucket: "boracaysean-69b4a.firebasestorage.app",
        messagingSenderId: "806585874771",
        appId: "1:806585874771:web:64a094d241730ca38109a6"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let html5QrcodeScanner = null;
    let currentAgencyId = null;

    window.showLoader = function(show) {
        document.getElementById('loader').style.display = show ? 'flex' : 'none';
    }

    // 1. Parse token from URL and switch screens
    async function init() {
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (token) {
            await loadAgencyByToken(token);
        } else {
            document.getElementById('view-scan').style.display = 'flex';
        }
    }

    // 2. Verify agency by token
    async function loadAgencyByToken(token) {
        showLoader(true);
        try {
            const q = query(collection(db, "whale_agencies"), where("token", "==", token));
            const querySnapshot = await getDocs(q);

            if (querySnapshot.empty) {
                Swal.fire('Error', 'Invalid QR code.', 'error').then(() => {
                    resetToScan();
                });
                return;
            }

            const agencyDoc = querySnapshot.docs[0];
            const agency = agencyDoc.data();

            if (agency.status !== 'ACTIVE') {
                Swal.fire('Suspended', 'This agency is currently suspended. Please contact the administrator.', 'warning').then(() => {
                    resetToScan();
                });
                return;
            }

            currentAgencyId = agencyDoc.id;

            document.getElementById('view-scan').style.display = 'none';
            document.getElementById('view-counter').style.display = 'flex';
            document.getElementById('display-remain').innerText = agency.remainCount || 0;
            document.getElementById('input-count').value = '';
            document.getElementById('input-remark').value = '';

        } catch (e) {
            console.error(e);
            Swal.fire('Error', 'An error occurred while loading data.', 'error');
        } finally {
            showLoader(false);
        }
    }

    // 3. Atomic deduction via transaction
    document.getElementById('btn-deduct').addEventListener('click', async () => {
        if (!currentAgencyId) return;

        const deductCountStr = document.getElementById('input-count').value;
        const deductCount = parseInt(deductCountStr);
        const remark = document.getElementById('input-remark').value.trim();

        if (isNaN(deductCount) || deductCount <= 0) {
            Swal.fire('Error', 'Please enter a valid number of visitors to deduct.', 'warning');
            return;
        }

        const confirmMsg = `Process ${deductCount} ticket(s) as used?`;
        if (!confirm(confirmMsg)) return;

        showLoader(true);
        const agencyRef = doc(db, "whale_agencies", currentAgencyId);

        const today = new Date();
        const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
        const dailyCountRef = doc(db, "whale_daily_counts", todayStr);

        const newTransactionRef = doc(collection(db, "whale_transactions")); // auto-generated ID

        try {
            await runTransaction(db, async (transaction) => {
                const agencyDoc = await transaction.get(agencyRef);
                if (!agencyDoc.exists()) {
                    throw "Agency data not found.";
                }

                const agencyData = agencyDoc.data();
                const currentRemain = agencyData.remainCount || 0;

                if (currentRemain < deductCount) {
                    throw `Not enough remaining tickets. (Current: ${currentRemain})`;
                }

                // [Important] Firestore transaction rule: all GETs must happen before any UPDATE/SET!
                const dailyDoc = await transaction.get(dailyCountRef);

                // Update agency's remaining/used counts
                const newRemain = currentRemain - deductCount;
                const newTotalUsed = (agencyData.totalUsed || 0) + deductCount;

                let newMonthlyUsed = agencyData.monthlyUsed || 0;
                const todayForTx = new Date();
                const currentMonthStr = `${todayForTx.getFullYear()}-${String(todayForTx.getMonth() + 1).padStart(2, '0')}`;

                if (agencyData.currentMonth === currentMonthStr) {
                    newMonthlyUsed += deductCount;
                } else {
                    newMonthlyUsed = deductCount;
                }

                transaction.update(agencyRef, {
                    remainCount: newRemain,
                    totalUsed: newTotalUsed,
                    monthlyUsed: newMonthlyUsed,
                    currentMonth: currentMonthStr,
                    updatedAt: new Date().toISOString()
                });

                // Update daily visitor count
                let newDailyCount = deductCount;
                if (dailyDoc.exists()) {
                    newDailyCount += (dailyDoc.data().count || 0);
                    transaction.update(dailyCountRef, { count: newDailyCount });
                } else {
                    transaction.set(dailyCountRef, { count: newDailyCount, date: todayStr });
                }

                // Log the transaction
                transaction.set(newTransactionRef, {
                    agencyId: currentAgencyId,
                    type: 'USE',
                    amount: deductCount,
                    remark: remark || null,
                    createdAt: new Date().toISOString()
                });
            });

            const result = await Swal.fire({
                icon: 'success',
                title: 'Completed',
                text: `${deductCount} deducted.`,
                confirmButtonText: 'Done',
                showCancelButton: true,
                cancelButtonText: 'Entered by mistake (Undo)',
                cancelButtonColor: '#ff3b30',
                reverseButtons: true
            });

            if (result.dismiss === Swal.DismissReason.cancel) {
                await undoTransaction(currentAgencyId, newTransactionRef.id, deductCount);
            } else {
                resetToScan();
            }

        } catch (e) {
            console.error(e);
            Swal.fire('Error', e.toString(), 'error');
        } finally {
            showLoader(false);
        }
    });

    // Undo the deduction just made (offsetting transaction — reuses existing settlement/stat aggregation logic)
    async function undoTransaction(agencyId, originalTransactionId, amount) {
        showLoader(true);
        const agencyRef = doc(db, "whale_agencies", agencyId);
        const today = new Date();
        const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
        const dailyCountRef = doc(db, "whale_daily_counts", todayStr);
        const cancelRef = doc(collection(db, "whale_transactions"));

        try {
            await runTransaction(db, async (transaction) => {
                const agencyDoc = await transaction.get(agencyRef);
                if (!agencyDoc.exists()) throw "Agency data not found.";
                const agencyData = agencyDoc.data();

                const dailyDoc = await transaction.get(dailyCountRef);

                transaction.update(agencyRef, {
                    remainCount: (agencyData.remainCount || 0) + amount,
                    totalUsed: Math.max(0, (agencyData.totalUsed || 0) - amount),
                    monthlyUsed: Math.max(0, (agencyData.monthlyUsed || 0) - amount),
                    updatedAt: new Date().toISOString()
                });

                if (dailyDoc.exists()) {
                    transaction.update(dailyCountRef, { count: Math.max(0, (dailyDoc.data().count || 0) - amount) });
                }

                transaction.set(cancelRef, {
                    agencyId,
                    type: 'USE',
                    amount: -amount,
                    createdAt: new Date().toISOString(),
                    isCancellation: true,
                    cancelsTransactionId: originalTransactionId
                });
            });

            Swal.fire('Undo Complete', 'The deduction has been reversed.', 'success').then(() => resetToScan());
        } catch (e) {
            console.error(e);
            Swal.fire('Error', 'An error occurred while undoing: ' + e.toString(), 'error');
        } finally {
            showLoader(false);
        }
    }

    // 4. Initialize and start the QR scanner (html5-qrcode)
    window.startScanner = function() {
        document.getElementById('btn-start-scan').style.display = 'none';
        document.getElementById('reader').style.display = 'block';

        html5QrcodeScanner = new Html5Qrcode("reader");
        const config = {
            fps: 15,
            // Size the scan box relative to the viewfinder (75%, capped at 280px) instead of a
            // fixed 250px box, which used to require lining the QR up exactly to be recognized.
            qrbox: (viewfinderWidth, viewfinderHeight) => {
                const minEdge = Math.min(viewfinderWidth, viewfinderHeight);
                const size = Math.min(Math.floor(minEdge * 0.75), 280);
                return { width: size, height: size };
            },
            aspectRatio: 1.0,
            videoConstraints: {
                facingMode: "environment",
                width: { ideal: 1920 },
                height: { ideal: 1080 }
            }
        };

        html5QrcodeScanner.start({ facingMode: "environment" }, config,
            (decodedText, decodedResult) => {
                // Stop the scanner on success
                html5QrcodeScanner.stop().then(() => {
                    document.getElementById('reader').style.display = 'none';
                    document.getElementById('btn-start-scan').style.display = 'block';

                    // Parse the URL to extract the token
                    try {
                        const parsedUrl = new URL(decodedText);
                        const token = parsedUrl.searchParams.get('token');
                        if (token) {
                            loadAgencyByToken(token);
                        } else {
                            Swal.fire('Error', 'Invalid QR code.', 'error');
                        }
                    } catch(e) {
                        // Not a URL format (in case it's just the raw token)
                        if (decodedText.startsWith('ws_')) {
                            loadAgencyByToken(decodedText);
                        } else {
                            Swal.fire('Error', 'Invalid QR code format.', 'error');
                        }
                    }
                }).catch(err => {
                    console.error("Failed to stop scanner", err);
                });
            },
            (errorMessage) => {
                // Scanning in progress (ignore)
            })
        .catch(err => {
            console.error(err);
            Swal.fire('Camera Error', 'Please allow camera access.', 'error');
            document.getElementById('btn-start-scan').style.display = 'block';
            document.getElementById('reader').style.display = 'none';
        });
    };

    window.resetToScan = function() {
        currentAgencyId = null;
        if (html5QrcodeScanner && html5QrcodeScanner.isScanning) {
            html5QrcodeScanner.stop().catch(console.error);
        }

        // Remove the token from the URL
        const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
        window.history.pushState({path:newUrl}, '', newUrl);

        document.getElementById('view-counter').style.display = 'none';
        document.getElementById('view-scan').style.display = 'flex';
        document.getElementById('reader').style.display = 'none';
        document.getElementById('btn-start-scan').style.display = 'block';
    };

    // Run initialization
    document.addEventListener('DOMContentLoaded', init);
</script>

</body>
</html>
